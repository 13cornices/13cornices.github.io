<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef } = React;

const FORMATIONS = { 11: [1, 4, 3, 3], 9: [1, 3, 2, 2], 7: [1, 2, 2, 1] };
const DEFAULT_LINE_CONFIGS = { 11: [4, 3, 2, 1], 9: [3, 2, 2, 1], 7: [2, 2, 1, 1] };
const FIELD_W = 360;
const FIELD_H = 460;
const STORAGE_KEY = "soccer_tracker_v2";

function defaultLineConfig(size) {
  return [...(DEFAULT_LINE_CONFIGS[size] || DEFAULT_LINE_CONFIGS[9])];
}

// Grid layout uses lineConfig [def, dm, am, fwd] with GK always = 1
// Falls back to [5,5,5,5] if not provided
function gridPoints(lineConfig) {
  const rows = lineConfig ? [1, ...lineConfig] : [1,5,5,5,5];
  const pts = [];
  const numRows = rows.length;
  const yTop = 38;
  const yBottom = FIELD_H - 24;
  rows.forEach((count, rowIdx) => {
    // rowIdx 0 = GK (bottom of field, near goal)
    // rowIdx (numRows-1) = forwards (top of field)
    const t = rowIdx / (numRows - 1);
    // flip so GK is near bottom (high y), forwards near top (low y)
    const y = yBottom - t * (yBottom - yTop);
    for (let c = 0; c < count; c++) {
      const x = (FIELD_W / (count + 1)) * (c + 1);
      pts.push({ x, y });
    }
  });
  return pts;
}

function snapToNearestGridPoint(x, y, lineConfig) {
  const pts = gridPoints(lineConfig);
  let best = null, bestD = Infinity;
  pts.forEach(p => {
    const d = Math.hypot(x - p.x, y - p.y);
    if (d < bestD) { bestD = d; best = p; }
  });
  return best || { x, y };
}


function defaultPositions(size, lineConfig) {
  const base = FORMATIONS[size] || FORMATIONS[9];
  // lineConfig overrides rows 1-4 (non-GK); row 0 is always [1] for GK
  const rows = lineConfig
    ? [1, ...lineConfig]
    : base;
  const positions = {};
  let idx = 0;
  rows.forEach((count, row) => {
    for (let c = 0; c < count; c++) {
      const x = (FIELD_W / (count + 1)) * (c + 1);
      const y = 44 + ((FIELD_H - 88) / (rows.length - 1)) * (rows.length - 1 - row);
      positions[idx] = { x, y };
      idx++;
    }
  });
  return positions;
}

function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
function fmtS(ms) {
  if (!ms) return "0:00";
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

// Deterministic key: normalize name+num so same player on different teams merges
function playerKey(name, num) {
  return (name || "").trim().toLowerCase().replace(/\s+/g,"_") + "__" + (num || "").trim();
}

// Always-unique ID — timestamp + random suffix to prevent collisions on bulk import
let _uidCounter = 0;
function uid() {
  return Date.now() + "_" + (++_uidCounter) + "_" + Math.random().toString(36).slice(2,7);
}

function loadTeams() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch { return []; }
}
function persistTeams(teams) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(teams)); } catch {}
}


const STATS_KEY    = "soccer_player_stats_v1";
const ROSTERS_KEY  = "soccer_rosters_v1";
const GAMES_KEY    = "soccer_games_v1";

// Roster: { id, name, isDefault, teamSize, players:[{id,name,num,lastName}] }
function loadRosters() { try { return JSON.parse(localStorage.getItem(ROSTERS_KEY)||"[]"); } catch { return []; } }
function persistRosters(r) { try { localStorage.setItem(ROSTERS_KEY, JSON.stringify(r)); } catch {} }

// Games: { [gameId]: { id, teamName, opponent, date, competition, score, events,
//           players:[{...playerWithStats}], teamSize } }
function loadGames() { try { return JSON.parse(localStorage.getItem(GAMES_KEY)||"{}"); } catch { return {}; } }
function persistGames(g) { try { localStorage.setItem(GAMES_KEY, JSON.stringify(g)); } catch {} }

const GAME_SETUPS_KEY = "soccer_game_setups_v1";
// Game setup (template): { id, name, teamName, teamSize, roster, h1Formation, h2Formation, opponent, competition, savedAt }
function loadGameSetups() { try { return JSON.parse(localStorage.getItem(GAME_SETUPS_KEY)||"[]"); } catch { return []; } }
function persistGameSetups(gs) { try { localStorage.setItem(GAME_SETUPS_KEY, JSON.stringify(gs)); } catch {} }

function makeGameId(teamName, opponent, date) {
  const d = date || new Date().toLocaleDateString();
  return [teamName, opponent||"Unknown", d].join("_vs_").replace(/[^a-zA-Z0-9_]/g,"-");
}

// Stats schema per player:
// { id, name, num, lastName, teams: [teamName],
//   games: 0, goals: 0, totalMs: 0, gkMs: 0,
//   yellowCards: 0, redCards: 0,
//   h1Ms: 0, h2Ms: 0 }

function loadStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY) || "{}"); } catch { return {}; }
}
function persistStats(stats) {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch {}
}

function normalizeTeamName(team) {
  return (team || "").trim();
}

function teamColor(team) {
  const palette = [
    { bg:"#0f2d45", border:"#1f6f9f", text:"#bae6fd" },
    { bg:"#2d2448", border:"#7c3aed", text:"#ddd6fe" },
    { bg:"#173225", border:"#15803d", text:"#bbf7d0" },
    { bg:"#3a260d", border:"#b45309", text:"#fde68a" },
    { bg:"#3a1520", border:"#be123c", text:"#fecdd3" },
    { bg:"#262b18", border:"#84cc16", text:"#ecfccb" },
  ];
  let h = 0;
  const s = normalizeTeamName(team).toLowerCase();
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}

function parseCSVRows(text) {
  const rows = [];
  let row = [], cell = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];
    if (ch === '"') {
      if (inQuotes && next === '"') { cell += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === "," && !inQuotes) {
      row.push(cell.trim());
      cell = "";
    } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
      if (ch === "\r" && next === "\n") i++;
      row.push(cell.trim());
      if (row.some(c => c !== "")) rows.push(row);
      row = [];
      cell = "";
    } else {
      cell += ch;
    }
  }
  row.push(cell.trim());
  if (row.some(c => c !== "")) rows.push(row);
  return rows;
}

function isJerseyValue(value) {
  const v = String(value || "").trim().replace(/^#/, "");
  return /^[0-9]{1,3}[A-Za-z]?$/.test(v);
}

function isHeaderRow(row) {
  return row.some(c => /^(#|no\.?|num|number|jersey|jersey\s*#|player|name|full\s*name|first\s*name|team|club|squad)$/i.test(String(c || "").trim()));
}

function detectRosterColumns(rows) {
  const header = rows.length && isHeaderRow(rows[0]) ? rows[0].map(c => String(c || "").trim().toLowerCase()) : null;
  const dataRows = header ? rows.slice(1) : rows;
  const colCount = Math.max(0, ...rows.map(r => r.length));
  let numIdx = null, nameIdx = null, teamIdx = null;

  if (header) {
    header.forEach((h, i) => {
      if (numIdx === null && /^(#|no\.?|num|number|jersey|jersey\s*#)$/.test(h)) numIdx = i;
      if (nameIdx === null && /^(player|name|full\s*name|first\s*name|player\s*name)$/.test(h)) nameIdx = i;
      if (teamIdx === null && /^(team|club|squad|group)$/.test(h)) teamIdx = i;
    });
  }

  const stats = Array.from({ length: colCount }, (_, idx) => {
    const values = dataRows.map(r => (r[idx] || "").trim()).filter(Boolean);
    const unique = new Set(values.map(v => v.toLowerCase()));
    const numeric = values.filter(isJerseyValue).length;
    const repeats = values.length - unique.size;
    const wordScore = values.reduce((sum, v) => sum + Math.min(3, v.split(/\s+/).filter(Boolean).length), 0);
    return { idx, values, uniqueCount: unique.size, numeric, repeats, wordScore };
  });

  if (numIdx === null) {
    const candidate = stats
      .filter(s => s.values.length > 0)
      .sort((a,b) => (b.numeric / b.values.length) - (a.numeric / a.values.length))[0];
    if (candidate && candidate.numeric / candidate.values.length >= 0.6) numIdx = candidate.idx;
  }

  if (teamIdx === null) {
    const candidate = stats
      .filter(s => s.idx !== numIdx && s.values.length > 1)
      .sort((a,b) => {
        const aScore = a.repeats * 3 - a.wordScore / Math.max(1, a.values.length);
        const bScore = b.repeats * 3 - b.wordScore / Math.max(1, b.values.length);
        return bScore - aScore;
      })[0];
    if (candidate && candidate.repeats > 0) teamIdx = candidate.idx;
  }

  if (nameIdx === null) {
    const candidate = stats
      .filter(s => s.idx !== numIdx && s.idx !== teamIdx && s.values.length > 0)
      .sort((a,b) => b.wordScore - a.wordScore)[0];
    if (candidate) nameIdx = candidate.idx;
  }

  if (nameIdx === null) nameIdx = stats.find(s => s.idx !== numIdx && s.idx !== teamIdx)?.idx ?? 0;
  return { numIdx, nameIdx, teamIdx, dataRows };
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen]       = useState("setup");
  const [teamSize, setTeamSize]   = useState(9);
  const [teamName, setTeamName]   = useState("My Team");
  const [roster, setRoster]       = useState([]);       // setup-time list
  const [newName, setNewName]     = useState("");
  const [newNum, setNewNum]       = useState("");
  const [savedTeams, setSaved]    = useState(loadTeams);   // legacy - kept for migration
  const [rosters, setRosters]     = useState(loadRosters);
  const [savedGames, setSavedGames] = useState(loadGames);
  const [rosterModal, setRosterModal] = useState(false);   // load/save roster
  const [gameListModal, setGameListModal] = useState(false); // load past game
  const [saveRosterName, setSaveRosterName] = useState("");
  const [loadModal, setLoadModal] = useState(false);
  const [saveModal, setSaveModal] = useState(false);
  const [saveName, setSaveName]   = useState("");
  const [viewingGame, setViewingGame] = useState(null); // loaded game for summary view
  const [gameSetups, setGameSetups] = useState(loadGameSetups);
  const [gameSetupModal, setGameSetupModal] = useState(false); // "save"|"load"|false
  const [lastLoadedSetupName, setLastLoadedSetupName] = useState("");
  const [dataModal, setDataModal] = useState(false);
  const [settingsModal, setSettingsModal] = useState(false);
  const [showJerseyNum, setShowJerseyNum] = useState(true);
  const [showPlayerTeam, setShowPlayerTeam] = useState(true);
  const [showHalfCols, setShowHalfCols]     = useState(true);
  const [snapToGrid, setSnapToGrid]         = useState(true);
  const [showGrid, setShowGrid]             = useState(true);
  const [subPlanMode, setSubPlanMode]       = useState(true); // reserved for future
  const [tableSortCol, setTableSortCol]     = useState("shift");
  const [tableSortDir, setTableSortDir]     = useState("asc"); // "asc"|"desc"
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState("");
  const [opponent, setOpponent]     = useState("");
  const [gameDate, setGameDate]     = useState("");
  const [competition, setCompetition] = useState("");
  // Line configuration: [defenders, def-mid, att-mid, forwards] counts (excludes GK)
  // Default from FORMATIONS based on teamSize; user can adjust +/-
  const [lineConfig, setLineConfig] = useState(() => defaultLineConfig(9));

  // Saved formations for planning
  const [selectedPlayers, setSelectedPlayers] = useState(new Set()); // IDs of players assigned to game
  const [h1Formation, setH1Formation] = useState(null); // {field, bench, pos}
  const [h2Formation, setH2Formation] = useState(null);
  // Which formation screen is open in setup: null | "h1" | "h2"
  const [formationScreen, setFormationScreen] = useState(null);

  // Game
  // fieldPlayers: array indexed by slot (0..teamSize-1)
  // Each: { id, name, num, isGK, shiftMs, totalMs, benchMs:0 }
  const [field, setField]         = useState([]);
  const [bench, setBench]         = useState([]);
  // positions: { [slotIndex]: {x, y} }
  const [pos, setPos]             = useState({});
  const [gameMs, setGameMs]       = useState(0);
  const [running, setRunning]     = useState(false);
  const [gameEnded, setGameEnded] = useState(false);
  const [statsModal, setStatsModal] = useState(false);
  const [playerStats, setPlayerStats] = useState(loadStats);
  const [half, setHalf]           = useState(1);
  const [events, setEvents]       = useState([]);
  const [score, setScore]         = useState({ us: 0, them: 0 });
  const [goals, setGoals]         = useState({});       // { playerId: count }

  // UI
  const [selSlot, setSelSlot]     = useState(null);
  const [modal, setModal]         = useState(null);     // "player"|"sub"|"card"|"log"
  const [subSlot, setSubSlot]     = useState(null);
  const [cardSlot, setCardSlot]   = useState(null);
  const [drag, setDrag]           = useState(null);
  const [gameView, setGameView]     = useState("field"); // "field" | "table"
  const [fieldDragOver, setFieldDragOver] = useState(null); // benchIdx being hovered by field drag

  const timerRef        = useRef(null);
  const lastRef         = useRef(null);
  const svgRef          = useRef(null);
  const posRef           = useRef({});  // always-current mirror of pos state
  const planFieldRef     = useRef([]);
  const planBenchRef     = useRef([]);
  const planPosRef       = useRef({});
  const originalPosRef   = useRef({});  // snapshot of positions at drag-start (for stable hit-testing)
  const benchContRef    = useRef(null);
  const modalOpenedAt   = useRef(0);
  const benchDragRef    = useRef(null);  // {benchIdx, x, y, hoverSlot, hoverStart}
  const [benchDragState, setBenchDragState] = useState(null); // for rendering ghost + highlight
  const [subPlanBase, setSubPlanBase] = useState(null); // live lineup snapshot when planning starts
  const [planField, setPlanField] = useState(null);
  const [planBench, setPlanBench] = useState(null);
  const [planPos, setPlanPos] = useState(null);

  // ── Timer ────────────────────────────────────────────────────────────────────
  useEffect(() => {
    if (running) {
      lastRef.current = Date.now();
      timerRef.current = setInterval(() => {
        const now = Date.now();
        const d   = now - lastRef.current;
        lastRef.current = now;
        setGameMs(t => t + d);
        setField(fp => fp.map(p => ({ ...p, shiftMs: (p.shiftMs||0)+d, totalMs: (p.totalMs||0)+d, gkMs: (p.gkMs||0)+(p.isGK?d:0), h1Ms: (p.h1Ms||0)+(half===1?d:0), h2Ms: (p.h2Ms||0)+(half===2?d:0) })));
        setBench(bp => bp.map(p => ({ ...p, benchMs: p.dns ? (p.benchMs||0) : (p.benchMs||0)+d })));
      }, 500);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [running]);

  // Reset lineConfig when teamSize changes
  useEffect(() => {
    setLineConfig(defaultLineConfig(teamSize));
  }, [teamSize]);
  // so both halves use the same line structure
  useEffect(() => {
    if (formationScreen === "h1") {
      // Keep the current half's hand-placed players stable; only invalidate H2
      // so it regenerates with the updated line structure next time.
      setH2Formation(null);
    }
  }, [lineConfig]); // eslint-disable-line

  // Keep posRef always current so drag handlers bypass stale closures
  useEffect(() => { posRef.current = pos; }, [pos]);
  useEffect(() => { planFieldRef.current = planField || []; }, [planField]);
  useEffect(() => { planBenchRef.current = planBench || []; }, [planBench]);
  useEffect(() => { planPosRef.current = planPos || {}; }, [planPos]);

  // ── Setup actions ─────────────────────────────────────────────────────────────

  function exportAllRosters() {
    const json = JSON.stringify(savedTeams, null, 2);
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "soccer-rosters.json"; a.click();
    URL.revokeObjectURL(url);
  }

  function importAllRosters(text) {
    try {
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed)) throw new Error("Expected an array");
      parsed.forEach(t => {
        if (!t.name || !t.size || !Array.isArray(t.players)) throw new Error("Invalid team format");
      });
      const merged = [...savedTeams];
      parsed.forEach(t => {
        if (!merged.find(x => x.name === t.name)) merged.push(t);
      });
      setSaved(merged); persistTeams(merged);
      setImportText(""); setImportError("");
      alert("Imported " + parsed.length + " team(s) successfully.");
    } catch(e) {
      setImportError("Import failed: " + e.message);
    }
  }

  function addPlayer() {
    const n = newName.trim(); if (!n) return;
    const id = uid();
    setRoster(r => [...r, { id, name: n, num: newNum.trim(), team: "" }]);
    setSelectedPlayers(s => new Set([...s, id])); // auto-select new players
    setH1Formation(null); setH2Formation(null);
    setNewName(""); setNewNum("");
  }

  function removePlayer(id) {
    setRoster(r => r.filter(p => p.id !== id));
    setSelectedPlayers(s => { const next = new Set(s); next.delete(id); return next; });
    setH1Formation(null); setH2Formation(null);
  }

  function togglePlayerSelected(id) {
    setSelectedPlayers(s => {
      const next = new Set(s);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
    setH1Formation(null); setH2Formation(null);
  }

  function selectAllPlayers() {
    setSelectedPlayers(new Set(roster.map(p => p.id)));
    setH1Formation(null); setH2Formation(null);
  }

  function clearAllSelected() {
    setSelectedPlayers(new Set());
    setH1Formation(null); setH2Formation(null);
  }

  function selectPlayersByTeam(team) {
    const target = normalizeTeamName(team);
    setSelectedPlayers(new Set(roster.filter(p => normalizeTeamName(p.team) === target).map(p => p.id)));
    setH1Formation(null); setH2Formation(null);
  }

  function changeTeamSize(n) {
    setTeamSize(n);
    setH1Formation(null); setH2Formation(null);
  }

  // Open the formation planner for h1 or h2
  function openFormation(which) {
    const selCount = [...selectedPlayers].filter(id => roster.find(p=>p.id===id)).length;
    if (selCount < teamSize) return;
    const existing = which==="h1" ? h1Formation : h2Formation;
    if (existing) {
      // Restore saved formation; if opening h2 and it has no DNS data, carry from h1
      if (which === "h2" && h1Formation) {
        const dnsById = {};
        h1Formation.bench.forEach(p => { dnsById[p.id] = p.dns || false; });
        setField(existing.field.map(p => ({ ...p })));
        setBench(existing.bench.map(p => ({ ...p, dns: p.dns ?? (dnsById[p.id] || false) })));
      } else {
        setField(existing.field);
        setBench(existing.bench);
      }
      setPos(existing.pos);
    } else {
      // Build from selected players; first teamSize go on field, rest on bench
      const selected = roster.filter(p => selectedPlayers.has(p.id));
      const active = selected.length >= teamSize ? selected : roster; // fallback to all if none selected
      // When building h2 from scratch, carry DNS flags from h1 bench if available
      const h1DnsById = {};
      if (which === "h2" && h1Formation) {
        h1Formation.bench.forEach(p => { h1DnsById[p.id] = p.dns || false; });
      }
      setField(active.slice(0, teamSize).map((p, i) => ({ ...p, slot: i, isGK: i===0, shiftMs:0, totalMs:0, benchMs:0, gkMs:0, h1Ms:0, h2Ms:0 })));
      setBench(active.slice(teamSize).map(p => ({ ...p, shiftMs:0, totalMs:0, benchMs:0, gkMs:0, h1Ms:0, h2Ms:0, dns: h1DnsById[p.id] || false })));
      setPos(defaultPositions(teamSize, lineConfig));
    }
    setFormationScreen(which);
    setScreen("game");
  }

  // Save current formation layout back to h1 or h2
  function saveFormation(which) {
    const formation = { field: field.map(p=>({...p})), bench: bench.map(p=>({...p})), pos: {...pos} };
    if (which==="h1") setH1Formation(formation);
    else setH2Formation(formation);
  }

  // Actually start the game — always uses h1 formation regardless of which screen called it
  function launchGame(which) {
    // Save current screen's formation first
    const savedWhich = { field: field.map(p=>({...p})), bench: bench.map(p=>({...p})), pos: {...pos} };
    if (which==="h1") setH1Formation(savedWhich);
    else setH2Formation(savedWhich);
    // Use h1Formation if it exists, else use current field state (which IS h1 if called from h1 screen)
    const f1 = (which==="h1" ? savedWhich : h1Formation) || savedWhich;
    setField(f1.field.map(p=>({...p, shiftMs:0, totalMs:0, benchMs:0, gkMs:0, h1Ms:0, h2Ms:0})));
    setBench(f1.bench.map(p=>({...p, shiftMs:0, totalMs:0, benchMs:0, gkMs:0, h1Ms:0, h2Ms:0})));
    setPos(f1.pos);
    // Build initial events: kickoff + one DNS log per absent bench player
    const kickoffEvt = { time:"00:00", text:"▶ Kickoff — 1st half" };
    const dnsEvts = f1.bench
      .filter(p => p.dns)
      .map(p => ({ time:"00:00", text:`🚫 DNS: ${p.num?"#"+p.num+" ":""}${p.name} — did not show` }));
    setEvents([kickoffEvt, ...dnsEvts]);
    setScore({us:0,them:0}); setGoals({}); setHalf(1);
    if (!gameDate) setGameDate(new Date().toLocaleDateString());
    setRunning(true);
    setGameEnded(false);
    setFormationScreen(null);
    setScreen("game");
  }

  function importRosterCSV(text) {
    const rows = parseCSVRows(text);
    const { numIdx, nameIdx, teamIdx, dataRows } = detectRosterColumns(rows);
    const players = dataRows.map(cols => {
      const rawName = (cols[nameIdx] || "").trim();
      if (!rawName || /^(player|name|full\s*name|first\s*name)$/i.test(rawName)) return null;
      const rawNum = numIdx !== null ? (cols[numIdx] || "").trim().replace(/^#/, "") : "";
      const team = teamIdx !== null ? normalizeTeamName(cols[teamIdx]) : "";
      return {
        id: uid(),
        name: rawName,
        num: rawNum || "",
        lastName: "",
        team,
      };
    }).filter(Boolean);
    if (players.length > 0) {
      setRoster(players);
      setSelectedPlayers(new Set(players.map(p => p.id)));
      setH1Formation(null); setH2Formation(null);
    }
    return players.length;
  }

  function exportGameCSV(game) {
    const esc = v => `"${String(v||"").replace(/"/g,'""')}"`;
    const rows = [];
    rows.push(["GAME", game.id]);
    rows.push(["Date", game.date, "Opponent", game.opponent, "Competition", game.competition||""]);
    rows.push(["Score", game.teamName + " " + game.score.us + " : " + game.score.them + " " + game.opponent]);
    rows.push([]);
    rows.push(["#","Name","Last Name","Status","Played","H1","H2","GK","Goals"]);
    (game.players||[]).forEach(p=>{
      rows.push([p.num||"",p.name,p.lastName||"",p.status||"",
        fmtS(p.totalMs||0),fmtS(p.h1Ms||0),fmtS(p.h2Ms||0),fmtS(p.gkMs||0),
        game.goals?.[p.id]||0]);
    });
    rows.push([]);
    rows.push(["EVENT LOG"]);
    (game.events||[]).forEach(ev=>rows.push([ev.time, ev.text]));
    const csv = rows.map(r=>r.map(esc).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=game.id+".csv"; a.click();
    URL.revokeObjectURL(url);
  }

  function saveGameToStats() {
    const all = [...field, ...bench];
    const cardEvents = {};
    events.forEach(ev => {
      const ym = ev.text.match(/YELLOW CARD: (.+)$/i);
      const rm = ev.text.match(/RED CARD: (.+)$/i);
      if (ym) { const k=ym[1].trim(); cardEvents[k] = cardEvents[k]||{y:0,r:0}; cardEvents[k].y++; }
      if (rm) { const k=rm[1].trim(); cardEvents[k] = cardEvents[k]||{y:0,r:0}; cardEvents[k].r++; }
    });
    setPlayerStats(prev => {
      const next = { ...prev };
      all.forEach(p => {
        const key = playerKey(p.name, p.num);
        const existing = next[key] || {
          id: key, name: p.name, num: p.num || "", lastName: "",
          teams: [], competitions: [], games: 0, goals: 0, totalMs: 0, gkMs: 0,
          h1Ms: 0, h2Ms: 0, yellowCards: 0, redCards: 0,
        };
        const cardKey = (p.num ? "#"+p.num+" " : "") + p.name;
        const cards = cardEvents[cardKey] || {y:0, r:0};
        const comp = competition || "";
        // Count goals scored while this player was on the field
        const pKey = playerKey(p.name, p.num);
        const goalsFor     = events.filter(ev => ev.forTeam  && ev.fieldIds?.includes(pKey)).length;
        const goalsAgainst = events.filter(ev => ev.forTeam===false && ev.fieldIds?.includes(pKey)).length;
        next[key] = {
          ...existing,
          name: p.name, num: p.num || "",
          teams: existing.teams.includes(teamName) ? existing.teams : [...existing.teams, teamName],
          competitions: comp && !(existing.competitions||[]).includes(comp) ? [...(existing.competitions||[]), comp] : (existing.competitions||[]),
          games:         existing.games + 1,
          goals:         existing.goals + (goals[p.id] || 0),
          goalsFor:      (existing.goalsFor||0) + goalsFor,
          goalsAgainst:  (existing.goalsAgainst||0) + goalsAgainst,
          totalMs:       existing.totalMs + (p.totalMs || 0),
          gkMs:          existing.gkMs + (p.gkMs || 0),
          h1Ms:          existing.h1Ms + (p.h1Ms || 0),
          h2Ms:          existing.h2Ms + (p.h2Ms || 0),
          yellowCards:   existing.yellowCards + cards.y,
          redCards:      existing.redCards + cards.r,
        };
      });
      persistStats(next);
      return next;
    });
  }

  function cloneLineup(arr) {

  function enterSubPlanning() {

  function cancelSubPlanning() {

    setPlanField(null);
    setPlanBench(null);

    setModal(null);

    setSubSlot(null);
