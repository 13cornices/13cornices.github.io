  function buildSubPlanSummary() {
    if (!subPlanBase || !planField || !planBench) return { ops: [], hasChanges: false };
    const baseField = subPlanBase.field || [];
    const targetField = planField || [];
    const basePos = subPlanBase.pos || {};
    const targetPos = planPos || {};
    const baseFieldIds = baseField.map(p => p.id);
    const targetFieldIds = targetField.map(p => p.id);
    const byId = {};
    [...baseField, ...(subPlanBase.bench || []), ...targetField, ...planBench].forEach(p => { byId[p.id] = p; });
    const posKey = p => p ? `${Math.round(p.x)}:${Math.round(p.y)}` : "";
    const samePos = (a, b) => posKey(a) === posKey(b);

    const sim = baseFieldIds.slice();
    const simPos = baseField.map((_, slot) => ({ ...(basePos[slot] || {}) }));
    const ops = [];
    const incomingSlots = targetFieldIds
      .map((id, slot) => ({ id, slot }))
      .filter(x => !baseFieldIds.includes(x.id));

    incomingSlots.forEach(({ id, slot }) => {
      const outId = sim[slot];
      ops.push({
        type: "sub",
        inP: byId[id],
        outP: byId[outId],
      });
      sim[slot] = id;
    });

    for (let slot = 0; slot < targetFieldIds.length; slot++) {
      if (sim[slot] === targetFieldIds[slot]) continue;
      const swapSlot = sim.findIndex(id => id === targetFieldIds[slot]);
      if (swapSlot >= 0) {
        ops.push({
          type: "swap",
          a: byId[sim[slot]],
          b: byId[sim[swapSlot]],
        });
        [sim[slot], sim[swapSlot]] = [sim[swapSlot], sim[slot]];
        [simPos[slot], simPos[swapSlot]] = [simPos[swapSlot], simPos[slot]];
      }
    }

    for (let slot = 0; slot < targetFieldIds.length; slot++) {
      if (samePos(simPos[slot], targetPos[slot])) continue;
      const swapSlot = simPos.findIndex((p, idx) => idx !== slot && samePos(p, targetPos[slot]));
      if (swapSlot >= 0) {
        ops.push({
          type: "swap",
          a: byId[sim[slot]],
          b: byId[sim[swapSlot]],
        });
        [simPos[slot], simPos[swapSlot]] = [simPos[swapSlot], simPos[slot]];
      } else {
        ops.push({
          type: "move",
          p: byId[sim[slot]],
        });
      }
    }

    return {
      ops,
      hasChanges:
        baseFieldIds.join("|") !== targetFieldIds.join("|") ||
        baseField.some((_, slot) => !samePos(basePos[slot], targetPos[slot])),
    };
  }

  function reviewSubPlan() {
    setModal("subPlanSummary");
  }

  function executeSubPlan() {
    const summary = buildSubPlanSummary();
    const liveById = {};
    [...field, ...bench].forEach(p => { liveById[p.id] = p; });
    const liveFieldIds = new Set(field.map(p => p.id));
    const finalField = (planField || []).map((p, slot) => {
      const live = liveById[p.id] || p;
      return {
        ...live,
        ...p,
        slot,
        shiftMs: liveFieldIds.has(p.id) ? (live.shiftMs || 0) : 0,
        totalMs: live.totalMs || 0,
        benchMs: live.benchMs || 0,
        gkMs: live.gkMs || 0,
        h1Ms: live.h1Ms || 0,
        h2Ms: live.h2Ms || 0,
        dns: false,
      };
    });
    const finalBench = (planBench || []).map(p => {
      const live = liveById[p.id] || p;
      return {
        ...live,
        ...p,
        totalMs: live.totalMs || 0,
        benchMs: live.benchMs || 0,
        gkMs: live.gkMs || 0,
        h1Ms: live.h1Ms || 0,
        h2Ms: live.h2Ms || 0,
      };
    });
    setField(finalField);
    setBench(finalBench);
    setPos({ ...(planPos || pos) });
    summary.ops.forEach(op => {
      if (op.type === "sub") addEvt(`🔄 ${playerLabel(op.inP)} IN for ${playerLabel(op.outP)}`);
      else if (op.type === "swap") addEvt(`↔ Position swap: ${playerLabel(op.a)} ⇄ ${playerLabel(op.b)}`);
      else addEvt(`↔ Position move: ${playerLabel(op.p)}`);
    });
    cancelSubPlanning();
  }

  function startHalf() {
    setRunning(true);
    addEvt(half===1 ? "▶ Kickoff — 1st half" : "▶ Kickoff — 2nd half");
    // Log any still-DNS players at the start of 2nd half
    if (half === 2) {
      bench.filter(p => p.dns).forEach(p =>
        addEvt(`🚫 DNS: ${p.num?"#"+p.num+" ":""}${p.name} — still not present`)
      );
    }
  }

  function doHalfTime() {
    setRunning(false);
    setGameMs(0);  // clock resets
    addEvt("⏸ Half time");
    // Log DNS players still absent at half time
    bench.filter(p=>p.dns).forEach(p=>addEvt(`🚫 DNS at half time: ${p.num?"#"+p.num+" ":""}${p.name}`));
    // Build a dns-status lookup from current bench (so DNS carries into h2)
    const dnsByIdCurrentBench = {};
    bench.forEach(p => { dnsByIdCurrentBench[p.id] = p.dns || false; });
    // Load h2 formation if saved, preserving accumulated totalMs/gkMs/h1Ms for each player
    if (h2Formation) {
      // Merge: use h2 positions/assignments but carry forward timing from current state
      const timingById = {};
      [...field, ...bench].forEach(p => { timingById[p.id] = { totalMs: p.totalMs||0, gkMs: p.gkMs||0, h1Ms: p.h1Ms||0, dns: p.dns||false }; });
      const mergedField = h2Formation.field.map(p => ({
        ...p,
        shiftMs: 0,
        totalMs: timingById[p.id]?.totalMs || p.totalMs || 0,
        gkMs:    timingById[p.id]?.gkMs    || p.gkMs    || 0,
        h1Ms:    timingById[p.id]?.h1Ms    || p.h1Ms    || 0,
        h2Ms: 0,
        benchMs: 0,
        dns: false, // field players in h2 are assumed present
      }));
      const mergedBench = h2Formation.bench.map(p => ({
        ...p,
        shiftMs: 0,
        totalMs: timingById[p.id]?.totalMs || p.totalMs || 0,
        gkMs:    timingById[p.id]?.gkMs    || p.gkMs    || 0,
        h1Ms:    timingById[p.id]?.h1Ms    || p.h1Ms    || 0,
        h2Ms: 0,
        benchMs: 0,
        // Carry DNS flag: use live bench status first, then h2Formation's stored flag
        dns: timingById[p.id]?.dns ?? (p.dns || false),
      }));
      setField(mergedField);
      setBench(mergedBench);
      setPos(h2Formation.pos);
    } else {
      // No h2 formation saved — reset shifts, keep dns flags on bench
      setField(fp => fp.map(p => ({ ...p, shiftMs: 0 })));
      // Carry DNS flags into bench for h2
      setBench(bp => bp.map(p => ({ ...p, shiftMs: 0, dns: dnsByIdCurrentBench[p.id] ?? p.dns ?? false })));
    }
    setHalf(2);
  }

  function endGame() {
    setRunning(false);
    addEvt(`🏁 Full time — ${score.us}:${score.them}`);
    setGameEnded(true);
    saveCurrentGame();  // persist game record to savedGames
    setScreen("summary");
  }

  function goalForSlot(slot) {
    const p = field[slot]; if (!p) return;
    setScore(s => ({ ...s, us: s.us+1 }));
    setGoals(g => ({ ...g, [p.id]: (g[p.id]||0)+1 }));
    // Record which players were on the field at time of goal
    const fieldIds = field.map(fp => playerKey(fp.name, fp.num));
    setEvents(ev => [...ev, { time: fmt(gameMs), text: `⚽ GOAL: ${p.num?"#"+p.num+" ":""}${p.name}`, forTeam: true, scorerId: playerKey(p.name, p.num), fieldIds }]);
    setModal(null); setSelSlot(null);
  }

  function oppGoal() {
    setScore(s => ({ ...s, them: s.them+1 }));
    const fieldIds = field.map(fp => playerKey(fp.name, fp.num));
    setEvents(ev => [...ev, { time: fmt(gameMs), text: "⚽ GOAL: Opponent", forTeam: false, fieldIds }]);
  }

  function doSub(benchP) {
    const slot = subSlot;
    const out  = activeField()[slot];
    setActiveField(fp => { const n=[...fp]; n[slot]={...benchP, slot, isGK:out.isGK, shiftMs:0, totalMs:benchP.totalMs||0, benchMs:benchP.benchMs||0, gkMs:benchP.gkMs||0, h1Ms:benchP.h1Ms||0, h2Ms:benchP.h2Ms||0}; return n; });
    setActiveBench(bp => bp.filter(p=>p.id!==benchP.id).concat([{...out, benchMs:out.benchMs||0}]));
    if (!subPlanBase) addEvt(`🔄 ${benchP.num?"#"+benchP.num+" ":""}${benchP.name} IN for ${out.num?"#"+out.num+" ":""}${out.name}`);
    setSubSlot(null); setModal(null); setSelSlot(null);
  }


  function assignGK(slot) {
    // Makes slot the GK, removes GK from any other player. If they're already GK, remove it (so you can unmark).
    setActiveField(fp => fp.map((p, i) => {
      if (i === slot) return { ...p, isGK: !p.isGK };   // toggle for the tapped player
      return { ...p, isGK: false };                       // clear GK from everyone else
    }));
    const p = activeField()[slot];
    const willBeGK = !p.isGK;
    if (!subPlanBase) addEvt(willBeGK ? `★ GK assigned: ${p.num?"#"+p.num+" ":""}${p.name}` : `★ GK removed: ${p.num?"#"+p.num+" ":""}${p.name}`);
    setModal(null); setSelSlot(null);
  }

  function giveCard(slot, type) {
    const p = field[slot];
    const label = (p.num ? "#"+p.num+" " : "") + p.name;
    addEvt((type==="yellow" ? "🟨" : "🟥") + " " + type.toUpperCase() + " CARD: " + label);
    if (type === "red") {
      // Remove from field, add to bench as permanently ejected
      setField(fp => fp.filter((_, i) => i !== slot));
      setPos(ps => {
        const next = {};
        Object.entries(ps).forEach(([k, v]) => {
          const ki = parseInt(k);
          if (ki < slot) next[ki] = v;
          else if (ki > slot) next[ki - 1] = v;
        });
        return next;
      });
      setBench(bp => [...bp, { ...p, ejected: true, benchMs: p.benchMs || 0 }]);
      addEvt("🚫 " + label + " ejected — down to " + (field.length - 1) + " players");
    }
    setCardSlot(null); setModal(null); setSelSlot(null);
  }

  // ── Drag & tap — window-level so circle can follow finger into bench area ──────
  const dragRef2  = useRef(null);
  const [blinkSlot, setBlinkSlot] = useState(null); // slot to blink after sub
  const [blinkSlot2, setBlinkSlot2] = useState(null); // second slot for position swaps
  const [fieldHoverSlot, setFieldHoverSlot] = useState(null); // field player hovered during drag

  function svgPt(clientX, clientY) {
    const svg = svgRef.current; if (!svg) return null;
    const r = svg.getBoundingClientRect();
    // No clamping — let the circle follow the finger anywhere
    return {
      x: ((clientX - r.left) / r.width)  * FIELD_W,
      y: ((clientY - r.top)  / r.height) * FIELD_H,
    };
  }

  function getBenchIdxAt(clientX, clientY) {
    const bc = benchContRef.current; if (!bc) return null;
    const r = bc.getBoundingClientRect();
    if (clientY < r.top || clientY > r.bottom || clientX < r.left || clientX > r.right) return null;
    let found = null;
    bc.querySelectorAll('[data-benchidx]').forEach(el => {
      const er = el.getBoundingClientRect();
      if (clientX >= er.left && clientX <= er.right && clientY >= er.top && clientY <= er.bottom)
        found = parseInt(el.getAttribute('data-benchidx'));
    });
    return found;
  }

  function getFieldPoint(clientX, clientY) {
    const svg = svgRef.current; if (!svg) return null;
    const r = svg.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / r.width)  * FIELD_W,
      y: ((clientY - r.top)  / r.height) * FIELD_H,
    };
  }

  function getSubTargetSlotAtPoint(clientX, clientY) {
    const pt = getFieldPoint(clientX, clientY);
    if (!pt) return null;
    let best = null, bestD = 62;
    activeField().forEach((_, slot) => {
      const fp = activePos()[slot] || { x:50, y:50 };
      const d = Math.hypot(pt.x - fp.x, pt.y - fp.y);
      if (d < bestD) { bestD = d; best = slot; }
    });
    return best;
  }

  function getSwapTargetSlotAtPoint(clientX, clientY, excludeSlot) {
    const pt = getFieldPoint(clientX, clientY);
    if (!pt) return null;
    // Use frozen positions from drag-start so target players do not drift.
    const stablePos = originalPosRef.current;
    let best = null, bestD = 34;
    activeField().forEach((_, slot) => {
      if (slot === excludeSlot) return;
      const fp = stablePos[slot] || activePos()[slot] || { x:50, y:50 };
      const d = Math.hypot(pt.x - fp.x, pt.y - fp.y);
      if (d < bestD) { bestD = d; best = slot; }
    });
    return best;
  }

  function triggerBlink(slot, slot2) {
    setBlinkSlot(slot);
    if (slot2 !== undefined) setBlinkSlot2(slot2);
    setTimeout(() => { setBlinkSlot(null); setBlinkSlot2(null); }, 800);
  }

  // Window-level drag listeners attached/removed via useEffect
  useEffect(() => {
    if (!drag) return;

    function handleMove(e) {
      const t = e.touches?.[0] || e;
      const cx = t.clientX, cy = t.clientY;
      const d = dragRef2.current; if (!d) return;
      const dx = cx - d.startClient.x, dy = cy - d.startClient.y;
      if (!d.moved && Math.hypot(dx, dy) < 8) return;
      if (e.cancelable) e.preventDefault();

      // Move the dragged circle to follow the finger
      const pt = svgPt(cx, cy);
      if (pt) {
        setActivePos(ps => ({ ...ps, [d.slot]: { x: pt.x - d.ox, y: pt.y - d.oy } }));
      }

      dragRef2.current = { ...d, moved: true, clientX: cx, clientY: cy };

      // Highlight: use originalPosRef so targets don't drift
      setFieldDragOver(getBenchIdxAt(cx, cy));
      setFieldHoverSlot(getBenchIdxAt(cx, cy) !== null ? null : getSwapTargetSlotAtPoint(cx, cy, d.slot));
      if (!d.moved) setDrag(dv => dv ? { ...dv, moved: true } : dv);
    }

    function handleUp(e) {
      const t = e.changedTouches?.[0] || e;
      const d = dragRef2.current;
      dragRef2.current = null;
      setFieldDragOver(null);
      setFieldHoverSlot(null);
      window.removeEventListener('pointermove', handleMove);
      window.removeEventListener('pointerup',   handleUp);
      window.removeEventListener('touchmove',   handleMove);
      window.removeEventListener('touchend',    handleUp);

      if (!d) { originalPosRef.current = {}; setDrag(null); return; }

      if (!d.moved) {
        modalOpenedAt.current = Date.now();
        setSelSlot(d.slot);
        setModal("player");
        originalPosRef.current = {};
        setDrag(null);
        return;
      }

      // ── Find swap target using originalPosRef (stable positions) ────────────
      // Rule: find the nearest OTHER player. If the drop point is closer to that
      // player than to the dragged player's own start, trigger a swap.
      // This gives a natural "dragged more than halfway" feel.
      const targetSlot = getSwapTargetSlotAtPoint(t.clientX, t.clientY, d.slot);
      if (targetSlot !== null && activeField()[targetSlot]) {
        // Swap positions: dragged player goes to target's original spot, target goes to dragged player's start
        const origPositions = originalPosRef.current;
        const draggedStart  = d.startPos;
        const targetOrig    = origPositions[targetSlot] || activePos()[targetSlot] || { x:50, y:50 };

        // Handle GK flag if either player is GK
        setActiveField(fp => {
          const n = [...fp];
          if (n[d.slot] && n[targetSlot] && (n[d.slot].isGK || n[targetSlot].isGK)) {
            const gkA = n[d.slot].isGK;
            n[d.slot]     = { ...n[d.slot],     isGK: n[targetSlot].isGK };
            n[targetSlot] = { ...n[targetSlot], isGK: gkA };
          }
          return n;
        });
        setActivePos(ps => ({
          ...ps,
          [d.slot]:     { ...targetOrig },
          [targetSlot]: { ...draggedStart },
        }));
        triggerBlink(d.slot, targetSlot);
        originalPosRef.current = {};
        setDrag(null);
        return;
      }

      // ── Bench drop (substitution) ────────────────────────────────────────────
      const bIdx = getBenchIdxAt(t.clientX, t.clientY);
      if (bIdx !== null && activeBench()[bIdx]) {
        if (activeBench()[bIdx].dns || activeBench()[bIdx].ejected) {
          // Can't sub with DNS/ejected — snap back
          setActivePos(ps => ({ ...ps, [d.slot]: d.startPos }));
          originalPosRef.current = {};
          setDrag(null);
          return;
        }
        const out = activeField()[d.slot];
        const inP = activeBench()[bIdx];
        if (out && inP) {
          setActivePos(ps => ({ ...ps, [d.slot]: d.startPos }));
          setActiveField(fp => {
            const n = [...fp];
            n[d.slot] = { ...inP, slot:d.slot, isGK:out.isGK, shiftMs:0,
              totalMs:inP.totalMs||0, benchMs:inP.benchMs||0,
              gkMs:inP.gkMs||0, h1Ms:inP.h1Ms||0, h2Ms:inP.h2Ms||0 };
            return n;
          });
          setActiveBench(bp => bp.filter(x => x.id !== inP.id).concat([{ ...out, benchMs:out.benchMs||0 }]));
          if (!subPlanBase) addEvt("🔄 "+(inP.num?"#"+inP.num+" ":"")+inP.name+" IN for "+(out.num?"#"+out.num+" ":"")+out.name);
          triggerBlink(d.slot);
        }
        originalPosRef.current = {};
        setDrag(null);
        return;
      }

      // ── Dropped on empty field — snap back to start or snap to grid ──────────
      const cur = activePos()[d.slot] || { x:50, y:50 };
      const clampedX = Math.max(20, Math.min(FIELD_W-20, cur.x));
      const clampedY = Math.max(20, Math.min(FIELD_H-20, cur.y));
      const finalPos = snapToGrid
        ? snapToNearestGridPoint(clampedX, clampedY, lineConfig)
        : { x: clampedX, y: clampedY };
      setActivePos(ps => ({ ...ps, [d.slot]: finalPos }));
      originalPosRef.current = {};
      setDrag(null);
    }

    window.addEventListener('pointermove', handleMove, { passive: true });
    window.addEventListener('pointerup',   handleUp);
    window.addEventListener('touchmove',   handleMove, { passive: false });
    window.addEventListener('touchend',    handleUp);
    return () => {
      window.removeEventListener('pointermove', handleMove);
      window.removeEventListener('pointerup',   handleUp);
      window.removeEventListener('touchmove',   handleMove);
      window.removeEventListener('touchend',    handleUp);
    };
  }, [drag, field, bench, pos, planField, planBench, planPos, subPlanBase, snapToGrid, lineConfig]);

  function onCircleDown(e, slot) {
    e.stopPropagation();
    e.preventDefault();
    const t  = e.touches?.[0] || e;
    const p  = activePos()[slot] || { x:50, y:50 };
    const pt = svgPt(t.clientX, t.clientY);
    const player = activeField()[slot];
    const d  = {
      slot,
      startPos:    { ...p },                          // remember original position
      startClient: { x: t.clientX, y: t.clientY },
      ox:   pt ? pt.x - p.x : 0,
      oy:   pt ? pt.y - p.y : 0,
      moved: false,
      name: player?.name || "",
      num:  player?.num  || "",
    };
    dragRef2.current = d;
    // Freeze a snapshot of all positions at drag-start so swap hit-testing
    // always hit-tests against stable targets (not the moving dragged circle).
    originalPosRef.current = { ...activePos() };
    setDrag(d);
  }

  // SVG handlers — only bench drag now (field drag is on window)
  function onSVGMove(e) { if (benchDragRef.current) onBenchPointerMove(e); }
  function onSVGUp(e)   { if (benchDragRef.current) onBenchPointerUp(e);  }

  // ── Bench drag-to-field substitution ────────────────────────────────────────
  // Drag a bench player over a field circle, release to sub them in.
  // Sub drops use a wider target than field-to-field swaps.

  function onBenchCirclePointerDown(e, benchIdx) {
    if(activeBench()[benchIdx]?.ejected) return;
    if(activeBench()[benchIdx]?.dns) {
      modalOpenedAt.current = Date.now();
      setSelSlot(benchIdx);
      setModal("dnsAction");
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    const touch = e.touches?.[0]||e;
    benchDragRef.current = { benchIdx, x: touch.clientX, y: touch.clientY,
      startX: touch.clientX, startY: touch.clientY, hoverSlot: null };
    setBenchDragState({ benchIdx, x: touch.clientX, y: touch.clientY, hoverSlot: null });
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
  }

  function onBenchPointerMove(e) {
    const bd = benchDragRef.current; if(!bd) return;
    if (e.cancelable) e.preventDefault();
    const touch = e.touches?.[0]||e;
    const cx=touch.clientX, cy=touch.clientY;
    const slot = getSubTargetSlotAtPoint(cx, cy);
    benchDragRef.current = { ...bd, x: cx, y: cy, hoverSlot: slot };
    setBenchDragState({ benchIdx: bd.benchIdx, x: cx, y: cy, hoverSlot: slot });
  }

  function onBenchPointerUp(e) {
    const bd = benchDragRef.current;
    benchDragRef.current = null;
    setBenchDragState(null);
    if(!bd) return;
    const touch = e.changedTouches?.[0]||e;
    // Tap detection: if finger barely moved, open bench action modal
    const moved = Math.hypot(touch.clientX-(bd.startX||bd.x), touch.clientY-(bd.startY||bd.y));
    if(moved < 12) {
      modalOpenedAt.current = Date.now();
      setSelSlot(bd.benchIdx);
      setModal(activeBench()[bd.benchIdx]?.dns ? "dnsAction" : "benchAction");
      return;
    }
    // DNS players cannot be subbed in via drag
    if(activeBench()[bd.benchIdx]?.dns) return;
    const slot = getSubTargetSlotAtPoint(touch.clientX, touch.clientY);
    if(slot===null) return; // lifted over empty field — cancel
    const benchP = activeBench()[bd.benchIdx];
    const out = activeField()[slot];
    if(!benchP || !out) return;
    const outLabel=(out.num?"#"+out.num+" ":"")+out.name;
    const inLabel=(benchP.num?"#"+benchP.num+" ":"")+benchP.name;
    setActiveField(fp=>{ const n=[...fp]; n[slot]={...benchP,slot,isGK:out.isGK,shiftMs:0,totalMs:benchP.totalMs||0,benchMs:benchP.benchMs||0,gkMs:benchP.gkMs||0,h1Ms:benchP.h1Ms||0,h2Ms:benchP.h2Ms||0}; return n; });
    setActiveBench(bp=>bp.filter(x=>x.id!==benchP.id).concat([{...out,benchMs:out.benchMs||0}]));
    if (!subPlanBase) addEvt("🔄 "+inLabel+" IN for "+outLabel);
  }

  useEffect(() => {
    if (!benchDragState) return;
    function handleBenchMove(e) { onBenchPointerMove(e); }
    function handleBenchUp(e) { onBenchPointerUp(e); }
    window.addEventListener('pointermove', handleBenchMove);
    window.addEventListener('pointerup', handleBenchUp);
    window.addEventListener('touchmove', handleBenchMove, { passive:false });
    window.addEventListener('touchend', handleBenchUp);
    return () => {
      window.removeEventListener('pointermove', handleBenchMove);
      window.removeEventListener('pointerup', handleBenchUp);
      window.removeEventListener('touchmove', handleBenchMove);
      window.removeEventListener('touchend', handleBenchUp);
    };
  }, [benchDragState, field, bench, pos, planField, planBench, planPos, subPlanBase]);

  // ── Guards modal button clicks against touch bleed-through from the player circle tap.
  // If the modal just opened (within 350ms), ignore the event entirely.
  function safeClick(fn) {
    return (e) => {
      if (Date.now() - modalOpenedAt.current < 350) return;
      fn(e);
    };
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  if (screen === "setup") return (
    <Setup
      teamName={teamName} setTeamName={setTeamName}
      teamSize={teamSize}
      roster={roster}
      newName={newName} setNewName={setNewName}
      newNum={newNum} setNewNum={setNewNum}
      addPlayer={addPlayer} removePlayer={removePlayer} changeTeamSize={changeTeamSize}
      rosters={rosters}
      saveRoster={saveRoster} loadRoster={loadRoster}
      deleteRoster={deleteRoster} setDefaultRoster={setDefaultRoster}
      importRosterCSV={importRosterCSV}
      saveRosterName={saveRosterName} setSaveRosterName={setSaveRosterName}
      rosterModal={rosterModal} setRosterModal={setRosterModal}
      savedGames={savedGames} deleteGame={deleteGame}
      loadGameSummary={loadGameSummary} exportGameCSV={exportGameCSV}
      gameListModal={gameListModal} setGameListModal={setGameListModal}
      gameSetups={gameSetups} gameSetupModal={gameSetupModal} setGameSetupModal={setGameSetupModal}
      saveGameSetup={saveGameSetup} loadGameSetup={loadGameSetup} deleteGameSetup={deleteGameSetup}
      lastLoadedSetupName={lastLoadedSetupName}
      selectedPlayers={selectedPlayers} togglePlayerSelected={togglePlayerSelected}
      selectAllPlayers={selectAllPlayers} clearAllSelected={clearAllSelected}
      selectPlayersByTeam={selectPlayersByTeam}
      h1Formation={h1Formation} h2Formation={h2Formation}
      openFormation={openFormation}
      gameInProgress={events.length>0 && !gameEnded}
      onReturnToGame={()=>setScreen("game")}
      opponent={opponent} setOpponent={setOpponent}
      gameDate={gameDate} setGameDate={setGameDate}
      competition={competition} setCompetition={setCompetition}
      settingsModal={settingsModal} setSettingsModal={setSettingsModal}
      showJerseyNum={showJerseyNum} setShowJerseyNum={setShowJerseyNum}
      showPlayerTeam={showPlayerTeam} setShowPlayerTeam={setShowPlayerTeam}
      showHalfCols={showHalfCols} setShowHalfCols={setShowHalfCols}
      statsModal={statsModal} setStatsModal={setStatsModal}
      playerStats={playerStats} setPlayerStats={setPlayerStats}
      snapToGrid={snapToGrid} setSnapToGrid={setSnapToGrid}
      showGrid={showGrid} setShowGrid={setShowGrid}
      subPlanMode={subPlanMode} setSubPlanMode={setSubPlanMode}
    />
  );

  // ── FORMATION PLANNER SCREEN ─────────────────────────────────────────────────
  if (screen === "game" && formationScreen !== null) {
    const which = formationScreen;
    const otherWhich = which==="h1"?"h2":"h1";
    const otherLabel = which==="h1"?"2nd Half Formation":"1st Half Formation";
    return (
      <FormationPlanner
        which={which}
        field={field} bench={bench} pos={pos} goals={{}}
        setField={setField} setBench={setBench} setPos={setPos}
        teamName={teamName} teamSize={teamSize}
        showJerseyNum={showJerseyNum}
        snapToGrid={snapToGrid} showGrid={showGrid}
        lineConfig={lineConfig} setLineConfig={setLineConfig}
        which={which}
        onSave={()=>{ saveFormation(which); }}
        onLaunch={()=>launchGame(which)}
        onOther={()=>{ saveFormation(which); openFormation(otherWhich); }}
        onMenu={()=>{ saveFormation(which); setFormationScreen(null); setScreen("setup"); }}
        otherLabel={otherLabel}
        isH2={which==="h2"}
        gameInProgress={events.length>0 && !gameEnded}
        half={half}
      />
    );
  }

  if (screen === "summary") {
    // If viewing a loaded past game, use its data instead of live state
    const sg = viewingGame;
    const sumField   = sg ? (sg.players||[]).filter(p=>p.status==="field") : field;
    const sumBench   = sg ? (sg.players||[]).filter(p=>p.status!=="field") : bench;
    const sumEvents  = sg ? (sg.events||[]) : events;
    const sumScore   = sg ? sg.score : score;
    const sumGoals   = sg ? (sg.goals||{}) : goals;
    const sumGameMs  = sg ? (sg.gameMs||0) : gameMs;
    const sumTeam    = sg ? sg.teamName : teamName;
    const sumOpp     = sg ? sg.opponent : opponent;
    const sumDate    = sg ? sg.date : gameDate;
    const sumComp    = sg ? sg.competition : competition;
    return (
      <Summary
        field={sumField} bench={sumBench} events={sumEvents}
        score={sumScore} goals={sumGoals} gameMs={sumGameMs}
        teamName={sumTeam} opponent={sumOpp} gameDate={sumDate} competition={sumComp}
        teamSize={teamSize}
        statsSaved={!!sg || gameEnded}
        onSaveStats={saveGameToStats}
        onBack={() => {
          setViewingGame(null);
          setScreen("setup");
          if (!sg) { setField([]); setBench([]); setEvents([]); setRunning(false); setGameEnded(false); }
        }}
      />
    );
  }

  // ── GAME SCREEN ───────────────────────────────────────────────────────────────
  const planning = !!subPlanBase;
  const shownField = planning ? (planField || []) : field;
  const shownBench = planning ? (planBench || []) : bench;
  const shownPos = planning ? (planPos || {}) : pos;
  const subPlanSummary = planning ? buildSubPlanSummary() : { ops: [], hasChanges: false };
  const selP = selSlot !== null ? shownField[selSlot] : null;

  return (
    <div style={{...S.root, isolation:"isolate", background:planning?"#081b33":S.root.background}}>
      <div style={{background:"#0d1f3c",borderBottom:"1px solid #1e3a5f",flexShrink:0,position:"sticky",top:0,zIndex:10}}>
        {/* Row 1: team name / half / buttons */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"5px 10px"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,color:"#7aa0cc",fontWeight:700}}>{teamName}</span>
            <span style={{fontSize:9,color:"#4a6a8a",background:"#071120",padding:"2px 6px",borderRadius:9}}>H{half}</span>
            {planning && <span style={{fontSize:9,color:"#fef3c7",background:"#92400e",padding:"2px 6px",borderRadius:9,fontWeight:800}}>PLAN</span>}
          </div>
          <div style={{display:"flex",gap:4}}>
            <button
              onClick={()=>{ if(planning){reviewSubPlan(); return;} if(running) setRunning(false); if(events.length>0&&!gameEnded){ const snap={field:field.map(p=>({...p})),bench:bench.map(p=>({...p})),pos:{...pos}}; if(half===1)setH1Formation(snap); else setH2Formation(snap); setModal("saveStats"); } else { setScreen("setup"); } }}
              style={B.sm("#1e3a5f","#7aa0cc")}
            >Menu</button>
          </div>
        </div>
        {/* Row 2: clock | team score : opp score +Opp | team names */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"3px 10px 6px"}}>
          {/* Clock on the left */}
          <span style={{fontSize:22,fontWeight:800,letterSpacing:1,color:running?"#4ade80":"#f59e0b",fontVariantNumeric:"tabular-nums",minWidth:58}}>{fmt(gameMs)}</span>
          {/* Score in centre */}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:11,color:"#7aa0cc"}}>{teamName}</span>
            <span style={{fontSize:28,fontWeight:800,lineHeight:1}}>{score.us}</span>
            <span style={{fontSize:16,color:"#4a6a8a"}}>:</span>
            <span style={{fontSize:28,fontWeight:800,lineHeight:1}}>{score.them}</span>
            <span style={{fontSize:11,color:"#7aa0cc"}}>{opponent||"Opp"}</span>
            <button onClick={planning?undefined:oppGoal} disabled={planning} style={B.sm(planning?"#301313":"#7f1d1d",planning?"#7f1d1d":"#fca5a5")}>+</button>
          </div>
          {/* Spacer to keep score centred */}
          <span style={{minWidth:58}}/>
        </div>
      </div>

      {/* Field / Table toggle */}
      {gameView==="field" ? (
      <div style={{flex:1,display:"flex",justifyContent:"center",padding:"2px 4px 0",position:"relative",zIndex:0,minHeight:0,overflow:"hidden"}}>
        <svg ref={svgRef} viewBox={`0 0 ${FIELD_W} ${FIELD_H}`}
          style={{width:"100%",maxWidth:440,height:"100%",maxHeight:"100%",touchAction:"pan-y",cursor:drag?"grabbing":"default"}}
          onPointerMove={onSVGMove}
          onPointerUp={onSVGUp}
          onPointerCancel={e=>{benchDragRef.current=null; setBenchDragState(null);}}
        >
          {/* Pitch */}
          <rect width={FIELD_W} height={FIELD_H} fill={planning?"#1d4ed8":"#1a4a2a"} rx="8"/>
          <rect x={8} y={8} width={FIELD_W-16} height={FIELD_H-16} fill="none" stroke={planning?"#fbbf24":"#2d7a45"} strokeWidth={planning?"2.5":"1.5"} rx="5"/>
          <line x1={8} y1={FIELD_H/2} x2={FIELD_W-8} y2={FIELD_H/2} stroke={planning?"#93c5fd":"#2d7a45"} strokeWidth="1"/>
          <circle cx={FIELD_W/2} cy={FIELD_H/2} r={36} fill="none" stroke={planning?"#93c5fd":"#2d7a45"} strokeWidth="1"/>
          <rect x={FIELD_W/2-55} y={8} width={110} height={73} fill="none" stroke={planning?"#93c5fd":"#2d7a45"} strokeWidth="1"/>
          <rect x={FIELD_W/2-55} y={FIELD_H-81} width={110} height={73} fill="none" stroke={planning?"#93c5fd":"#2d7a45"} strokeWidth="1"/>
          <rect x={FIELD_W/2-25} y={1} width={50} height={10} fill="none" stroke={planning?"#fbbf24":"#3da05a"} strokeWidth="1.5"/>
          <rect x={FIELD_W/2-25} y={FIELD_H-11} width={50} height={10} fill="none" stroke={planning?"#fbbf24":"#3da05a"} strokeWidth="1.5"/>

          {/* Grid points overlay */}
          {showGrid && gridPoints(lineConfig).map((pt, i) => (
            <g key={"gp"+i}>
              <circle cx={pt.x} cy={pt.y} r={6} fill="none" stroke="rgba(255,255,255,0.25)" strokeWidth="1.5"/>
              <circle cx={pt.x} cy={pt.y} r={1.5} fill="rgba(255,255,255,0.35)"/>
            </g>
          ))}

          {/* Player circles — dragged slot rendered last so it's on top */}
          {shownField.map((player, slot) => {
            if (drag?.moved && slot === drag.slot) return null; // rendered last
            const p  = shownPos[slot] || {x:50, y:50};
            const g  = goals[player.id] || 0;
            const dn = player.num || String(slot+1);
            const isSel = selSlot === slot;
            return (
              <g key={player.id} onPointerDown={e=>onCircleDown(e,slot)} style={{cursor:"grab",touchAction:"none"}}>
                {/* Invisible hit area */}
                <circle cx={p.x} cy={p.y} r={40} fill="transparent" stroke="none"/>
                {/* Bench drag hover highlight */}
                {benchDragState?.hoverSlot===slot && (
                  <circle cx={p.x} cy={p.y} r={34} fill="none" stroke="#4ade80" strokeWidth="3" strokeDasharray="6 3"/>
                )}
                {/* Field-to-field swap hover highlight */}
                {fieldHoverSlot===slot && drag?.moved && (
                  <circle cx={p.x} cy={p.y} r={34} fill="none" stroke="#f59e0b" strokeWidth="3" strokeDasharray="6 3"/>
                )}
                {/* Sub confirmation blink ring */}
                {(blinkSlot===slot || blinkSlot2===slot) && (
                  <circle cx={p.x} cy={p.y} r={34} fill="none" stroke="#4ade80" strokeWidth="4"
                    style={{animation:"subBlink 0.4s ease-in-out 2"}}/>
                )}
                {/* GK dashed ring */}
                {player.isGK && <circle cx={p.x} cy={p.y} r={35} fill="none" stroke="#fbbf24" strokeWidth="3" strokeDasharray="6 3"/>}
                {/* Main circle */}
                <circle cx={p.x} cy={p.y} r={29}
                  fill={benchDragState?.hoverSlot===slot?"#14532d":isSel?"#1e40af":planning?"#0f172a":"#2563eb"}
                  stroke={benchDragState?.hoverSlot===slot?"#4ade80":isSel?"#93c5fd":planning?"#fbbf24":"#60a5fa"}
                  strokeWidth={benchDragState?.hoverSlot===slot?3:isSel?3:2}
                />
                {/* Shift time — top, larger */}
                <text x={p.x} y={p.y-7} textAnchor="middle" dominantBaseline="middle" fontSize="14" fill="#fff" fontWeight="700">{fmtS(player.shiftMs)}</text>
                {/* Total time played — bottom, slightly smaller */}
                <text x={p.x} y={p.y+11} textAnchor="middle" dominantBaseline="middle" fontSize="11" fill="#93c5fd">{fmtS(player.totalMs)}</text>
                {/* Goal badge */}
                {g>0 && <>
                  <circle cx={p.x+23} cy={p.y-23} r={9} fill="#f59e0b"/>
                  <text x={p.x+23} y={p.y-23} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill="#fff" fontWeight="700">{g}⚽</text>
                </>}
                {/* Name below circle — with optional jersey # */}
                <text x={p.x} y={p.y+44} textAnchor="middle" fontSize="11" fill="#e2e8f0" fontWeight="500">
                  {(()=>{const nm=player.name.length>11?player.name.slice(0,10)+"…":player.name; return showJerseyNum&&player.num?nm+" #"+player.num:nm;})()}
                </text>
              </g>
            );
          })}
        </svg>
      </div>
      ) : (
      /* ── TABLE VIEW ─────────────────────────────────────────────────────── */
      <div style={{flex:1,overflowY:"auto",background:"#071120",padding:"8px 10px"}}>
        <div style={{fontSize:10,color:"#4a6a8a",fontWeight:700,letterSpacing:1,marginBottom:8}}>
          PLAYING TIME — sorted least → most played{half===1?" (half time planning)":" (2nd half)"}
        </div>
        {(()=>{
          // Build sortable column defs
          const cols = [
            {key:"shift", label:"Shift", color:"#fff"},
            {key:"total", label:"Total", color:"#60a5fa"},
            {key:"gk",    label:"GK",   color:"#fbbf24"},
            ...(showHalfCols?[{key:"h1",label:"H1",color:"#a78bfa"},{key:"h2",label:"H2",color:"#34d399"}]:[]),
            {key:"goals", label:"⚽",   color:"#f59e0b"},
          ];
          const SortHdr = ({col})=>{
            const active=tableSortCol===col.key;
            const arrow=active?(tableSortDir==="asc"?" ↑":" ↓"):"";
            return (
              <span
                onClick={()=>{
                  if(tableSortCol===col.key) setTableSortDir(d=>d==="asc"?"desc":"asc");
                  else{setTableSortCol(col.key);setTableSortDir("asc");}
                }}
                style={{textAlign:"right",color:active?col.color:"#4a6a8a",cursor:"pointer",userSelect:"none",fontWeight:active?800:700}}
              >{col.label}{arrow}</span>
            );
          };
          const gridCols = "1fr"+" 46px".repeat(cols.length);
          // Sort rows: bench always after field, ejected always last, then by chosen col
          const rows = [
            ...field.map((p,i)=>({...p,_status:"field",_slot:i})),
            ...bench.filter(p=>!p.ejected).map(p=>({...p,_status:"bench"})),
            ...bench.filter(p=>p.ejected).map(p=>({...p,_status:"ejected"})),
          ].sort((a,b)=>{
            if(a._status==="ejected"&&b._status!=="ejected") return 1;
            if(b._status==="ejected"&&a._status!=="ejected") return -1;
            if(a._status==="bench"&&b._status==="field") return 1;
            if(b._status==="bench"&&a._status==="field") return -1;
            const dir=tableSortDir==="asc"?1:-1;
            const val=(p,k)=>{
              if(k==="shift") return p._status==="bench"?(p.benchMs||0):(p.shiftMs||0);
              if(k==="total") return p.totalMs||0;
              if(k==="gk")    return p.gkMs||0;
              if(k==="h1")    return p.h1Ms||0;
              if(k==="h2")    return p.h2Ms||0;
              if(k==="goals") return goals[p.id]||0;
              return 0;
            };
            return dir*(val(a,tableSortCol)-val(b,tableSortCol));
          });
          return (<>
        {/* Sortable header */}
        <div style={{display:"grid",gridTemplateColumns:gridCols,gap:3,padding:"6px 10px",background:"#1e3a5f",borderRadius:"8px 8px 0 0",fontSize:10,fontWeight:700,letterSpacing:0.3,marginBottom:1}}>
          <span style={{color:"#4a6a8a"}}>Player</span>
          {cols.map(c=><SortHdr key={c.key} col={c}/>)}
        </div>
        {rows.map((p,i,arr)=>{
          const g=goals[p.id]||0;
          const isBench=p._status==="bench";
          const isEjected=p._status==="ejected";
          const isLast=i===arr.length-1;
          const rowBg=isEjected?"#1a0505":isBench?"#091422":"#0d1f3c";
          const nameLabel=(()=>{const nm=p.name.length>13?p.name.slice(0,12)+"…":p.name; return showJerseyNum&&p.num?nm+" #"+p.num:nm;})();
          const shiftLabel = isBench ? fmtS(p.benchMs||0) : fmtS(p.shiftMs||0);
          const shiftSub   = isBench ? "bench" : "shift";
          const gkTime     = p.gkMs||0;
          return (
            <div key={p.id}
              onClick={isEjected?undefined:()=>{
                modalOpenedAt.current=Date.now();
                if(p._status==="field"){setSelSlot(p._slot);setModal("player");}
                else{setSubSlot(null);setSelSlot(null);setSubSlot(p._slot!==undefined?p._slot:null);
                  // For bench players open a special bench-action modal
                  setModal("benchAction");setSelSlot(bench.findIndex(b=>b.id===p.id));
                }
              }}
              style={{display:"grid",gridTemplateColumns:gridCols,gap:3,padding:"9px 10px",background:rowBg,borderBottom:"1px solid #071120",borderRadius:isLast?"0 0 8px 8px":undefined,alignItems:"center",cursor:isEjected?"default":"pointer",WebkitTapHighlightColor:"transparent"}}>
              <div style={{overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                  {p.isGK&&<span style={{fontSize:9,color:"#fbbf24",fontWeight:700,background:"#2d1f00",padding:"1px 5px",borderRadius:4}}>GK</span>}
                  {isBench&&!isEjected&&<span style={{fontSize:9,color:"#60a5fa",fontWeight:700,background:"#0a1e3a",padding:"1px 5px",borderRadius:4}}>BENCH</span>}
                  {isEjected&&<span style={{fontSize:9,color:"#fca5a5",fontWeight:700,background:"#3b0a0a",padding:"1px 5px",borderRadius:4}}>🟥 OUT</span>}
                  {!isEjected&&<span style={{fontSize:9,color:"#4a6a8a",marginLeft:"auto"}}>›</span>}
                </div>
                <div style={{fontSize:14,color:isEjected?"#4a6a8a":isBench?"#93c5fd":"#e2e8f0",fontWeight:isBench?400:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{nameLabel}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:14,color:isBench?"#f87171":"#fff",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{shiftLabel}</div>
                <div style={{fontSize:9,color:"#4a6a8a"}}>{shiftSub}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:14,color:"#60a5fa",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtS(p.totalMs||0)}</div>
                <div style={{fontSize:9,color:"#4a6a8a"}}>total</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:13,color:gkTime>0?"#fbbf24":"#1e3a5f",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{gkTime>0?fmtS(gkTime):"—"}</div>
                <div style={{fontSize:9,color:"#4a6a8a"}}>gk</div>
              </div>
              {showHalfCols&&<div style={{textAlign:"right"}}>
                <div style={{fontSize:12,color:"#a78bfa",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtS(p.h1Ms||0)}</div>
                <div style={{fontSize:9,color:"#4a6a8a"}}>h1</div>
              </div>}
              {showHalfCols&&<div style={{textAlign:"right"}}>
                <div style={{fontSize:12,color:"#34d399",fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{fmtS(p.h2Ms||0)}</div>
                <div style={{fontSize:9,color:"#4a6a8a"}}>h2</div>
              </div>}
              <div style={{textAlign:"right",fontSize:15,color:g>0?"#f59e0b":"#1e3a5f",fontWeight:700}}>{g||"—"}</div>
            </div>
          );
        })}
        <div style={{fontSize:10,color:"#4a6a8a",marginTop:8,textAlign:"center"}}>Tap 📋 Table again or ⚽ Field to return to the pitch</div>
          </>);
        })()}
      </div>
      )}

      {/* Timer controls */}
      <div style={{padding:"4px 8px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,background:"#0d1f3c",borderTop:"1px solid #1e3a5f",position:"relative",zIndex:drag?.moved?0:2,flexShrink:0,overflow:"hidden"}}>
        {planning ? (<>
          <button onClick={reviewSubPlan} style={B.ctrlCompact("#f59e0b","#fff7ed",true)}>Exit</button>
          <button onClick={cancelSubPlanning} style={B.ctrlCompact("#1e3a5f","#93c5fd")}>Cancel</button>
        </>) : (<>
          {!running && half===1 && events.length===0 && <button onClick={startHalf} style={B.ctrlCompact("#15803d","#bbf7d0",true)}>Start</button>}
          {running  && half===1 && <button onClick={()=>setRunning(false)} style={B.ctrlCompact("#854d0e","#fde68a")}>Pause</button>}
          {!running && half===1 && gameMs>0 && <button onClick={()=>setRunning(true)} style={B.ctrlCompact("#1d4ed8","#bfdbfe")}>Resume</button>}
          {running  && half===1 && <button onClick={doHalfTime} style={B.ctrlCompact("#7c3aed","#ddd6fe")}>Half</button>}
          {!running && half===2 && <button onClick={startHalf} style={B.ctrlCompact("#15803d","#bbf7d0",true)}>Start</button>}
          {running  && half===2 && <button onClick={()=>setRunning(false)} style={B.ctrlCompact("#854d0e","#fde68a")}>Pause</button>}
          {!running && half===2 && gameMs>0 && <button onClick={()=>setRunning(true)} style={B.ctrlCompact("#1d4ed8","#bfdbfe")}>Resume</button>}
          {half===2 && (running || gameMs>0) && <button onClick={endGame} style={B.ctrlCompact("#7f1d1d","#fca5a5")}>Full</button>}
          {(running || gameMs>0) && <button onClick={enterSubPlanning} style={B.ctrlCompact("#0e7490","#cffafe",true)}>Plan</button>}
        </>)}
        <button onClick={planning?undefined:()=>{modalOpenedAt.current=Date.now();setModal("log");}} disabled={planning} style={B.ctrlCompact(planning?"#0b1628":"#1e3a5f",planning?"#2f4a68":"#7aa0cc")}>Log</button>
        <button onClick={planning?undefined:()=>setGameView(v=>v==="field"?"table":"field")} disabled={planning} style={B.ctrlCompact(planning?"#0b1628":gameView==="table"?"#1d4ed8":"#1e3a5f",planning?"#2f4a68":gameView==="table"?"#bfdbfe":"#7aa0cc")}>{gameView==="table"?"Field":"Table"}</button>
      </div>

      {/* ── Bench section ────────────────────────────────────────────────── */}
      <div ref={benchContRef} style={{padding:"5px 10px 8px",background:"#050e1e",borderTop:"1px solid #0d1f3c",position:"relative",zIndex:drag?.moved?0:1,flexShrink:0}}
        onPointerMove={benchDragRef.current ? onBenchPointerMove : undefined}
        onPointerUp={benchDragRef.current ? onBenchPointerUp : undefined}
        onPointerCancel={onBenchPointerUp}
      >
        <div style={{fontSize:9,color:"#4a6a8a",marginBottom:7,fontWeight:700,letterSpacing:1}}>
          {planning ? "PLANNED " : ""}BENCH ({shownBench.filter(p=>!p.ejected).length}) — drag to field to sub · red=bench time, blue=played
        </div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"flex-start"}}>
          {[...shownBench].sort((a,b)=>{
            if(a.ejected&&!b.ejected) return 1;
            if(!a.ejected&&b.ejected) return -1;
            if(a.dns&&!b.dns) return -1; // late players leftmost
            if(!a.dns&&b.dns) return 1;
            const bd=(a.benchMs||0)-(b.benchMs||0);
            return bd!==0?bd:(b.totalMs||0)-(a.totalMs||0);
          }).map((p,sortedIdx) => {
            const origIdx = shownBench.findIndex(x=>x.id===p.id);
            const g = goals[p.id]||0;
            const circleFill   = p.ejected ? "#3b0a0a" : p.dns ? "#1a1a0a" : "#1e3a5f";
            const circleStroke = p.ejected ? "#991b1b" : p.dns ? "#a16207" : "#2d5a8f";
            const isDragging   = benchDragState?.benchIdx===origIdx;
            const nm = p.name.length>11?p.name.slice(0,10)+"…":p.name;
            const nameLabel = showJerseyNum&&p.num ? nm+" #"+p.num : nm;
            return (
              <div key={p.id}
                data-benchidx={origIdx}
                onPointerDown={p.ejected?undefined:e=>onBenchCirclePointerDown(e,origIdx)}
                style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,opacity:isDragging?0.35:1,cursor:p.ejected?"default":"grab",touchAction:"none"}}
              >
                <div style={{position:"relative",width:58,height:58}}>
                  <svg width="58" height="58" viewBox="0 0 58 58">
                    {fieldDragOver===origIdx && !p.ejected && !p.dns && <circle cx={29} cy={29} r={28} fill="none" stroke="#4ade80" strokeWidth="2.5" strokeDasharray="5 3"/>}
                    <circle cx={29} cy={29} r={25} fill={fieldDragOver===origIdx&&!p.dns?"#14532d":circleFill} stroke={isDragging?"#60a5fa":fieldDragOver===origIdx&&!p.dns?"#4ade80":circleStroke} strokeWidth={isDragging||fieldDragOver===origIdx&&!p.dns?3:2}/>
                    {p.ejected ? (
                      <text x={29} y={31} textAnchor="middle" dominantBaseline="middle" fontSize="16">🟥</text>
                    ) : p.dns ? (<>
                      <text x={29} y={24} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="#a16207" fontWeight="700">{p.num||"?"}</text>
                      <text x={29} y={38} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill="#60a5fa">{fmtS(p.totalMs)}</text>
                    </>) : (<>
                      <text x={29} y={24} textAnchor="middle" dominantBaseline="middle" fontSize="12" fill="#f87171" fontWeight="700">{fmtS(p.benchMs)}</text>
                      <text x={29} y={38} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill="#60a5fa">{fmtS(p.totalMs)}</text>
                    </>)}
                  </svg>
                  {g>0 && <div style={{position:"absolute",top:-3,right:-3,background:"#f59e0b",borderRadius:"50%",width:16,height:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"#fff"}}>{g}</div>}
                </div>
                <span style={{fontSize:9,color:p.ejected?"#fca5a5":"#7aa0cc",maxWidth:58,textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nameLabel}</span>
              </div>
            );
          })}
          {shownBench.filter(p=>!p.ejected).length===0 && <span style={{fontSize:11,color:"#4a6a8a"}}>No subs available</span>}
        </div>
      </div>

      {/* Field drag portal ghost — fixed position, always above everything */}
      {drag?.moved && shownField[drag.slot] && dragRef2.current?.clientX !== undefined && (()=>{
        const d = dragRef2.current;
        const player = shownField[d.slot];
        if (!player) return null;
        const nm = player.name.length>8?player.name.slice(0,7)+"…":player.name;
        const cx = d.clientX, cy = d.clientY;
        return (
          <div style={{position:"fixed",left:cx-32,top:cy-36,width:64,height:64,pointerEvents:"none",zIndex:9999}}>
            <svg width="64" height="64" viewBox="0 0 64 64">
              {player.isGK&&<circle cx={32} cy={32} r={31} fill="none" stroke="#fbbf24" strokeWidth="2.5" strokeDasharray="5 3"/>}
              <circle cx={32} cy={32} r={30} fill={planning?"#0f172a":"#1e40af"} stroke={planning?"#fbbf24":"#93c5fd"} strokeWidth="3"/>
              <text x={32} y={26} textAnchor="middle" dominantBaseline="middle" fontSize="13" fill="#fff" fontWeight="700">{fmtS(player.shiftMs)}</text>
              <text x={32} y={40} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="#93c5fd">{fmtS(player.totalMs)}</text>
            </svg>
            <div style={{position:"absolute",bottom:-14,left:"50%",transform:"translateX(-50%)",fontSize:9,color:"#e2e8f0",whiteSpace:"nowrap",fontWeight:500}}>{nm}</div>
          </div>
        );
      })()}

      {/* Bench drag ghost — floating circle following the finger */}
      {benchDragState && shownBench[benchDragState.benchIdx] && (()=>{
        const bp=shownBench[benchDragState.benchIdx];
        const nm=bp.name.length>8?bp.name.slice(0,7)+"…":bp.name;
        return (
          <div style={{position:"fixed",left:benchDragState.x-32,top:benchDragState.y-52,width:64,height:64,pointerEvents:"none",zIndex:200,opacity:0.92}}>
            <svg width="64" height="64" viewBox="0 0 64 64">
              <circle cx={32} cy={32} r={28} fill="#1d4ed8" stroke="#93c5fd" strokeWidth="2.5"/>
              <text x={32} y={28} textAnchor="middle" dominantBaseline="middle" fontSize="13" fill="#fff" fontWeight="700">{fmtS(bp.benchMs||0)}</text>
              <text x={32} y={43} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="#93c5fd">{nm}</text>
            </svg>
          </div>
        );
      })()}

      {/* ── Modals ── */}

      {/* Player action */}
      {modal==="player" && selP && (
        <div style={S.overlay} onClick={safeClick(()=>{setModal(null);setSelSlot(null);})}>
          <div style={S.card} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>{selP.num?`#${selP.num} `:""}{selP.name}</div>
            <div style={{fontSize:11,color:"#7aa0cc",marginBottom:14}}>
              Total: {fmtS(selP.totalMs)} · Shift: {fmtS(selP.shiftMs)}
              {selP.isGK && <span style={{marginLeft:8,color:"#fbbf24"}}>★ GK</span>}
              {(goals[selP.id]||0)>0 && <span style={{marginLeft:8,color:"#f59e0b"}}>⚽×{goals[selP.id]}</span>}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <button onClick={safeClick(()=>{modalOpenedAt.current=Date.now();setSubSlot(selSlot);setModal("sub");})} style={B.act("#1d4ed8","#93c5fd")}>{planning?"Plan Substitute Out":"🔄 Substitute Out"}</button>
              {!planning && <button onClick={safeClick(()=>goalForSlot(selSlot))} style={B.act("#15803d","#86efac")}>⚽ Goal Scored</button>}
              {!planning && <button onClick={safeClick(()=>{modalOpenedAt.current=Date.now();setCardSlot(selSlot);setModal("card");})} style={B.act("#b45309","#fde68a")}>🟨 Card</button>}
              {!planning && <button onClick={safeClick(()=>assignGK(selSlot))} style={B.act("#7c3aed","#c4b5fd")}>{selP.isGK?"★ Remove GK marker":"★ Assign as Goalkeeper"}</button>}
            </div>
            <button onClick={safeClick(()=>{setModal(null);setSelSlot(null);})} style={B.cancel()}>Cancel</button>
          </div>
        </div>
      )}

      {/* Sub picker */}
      {modal==="sub" && subSlot!==null && (
        <div style={S.overlay} onClick={safeClick(()=>{setModal(null);setSubSlot(null);})}>
          <div style={{...S.card,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:14,color:"#fff",marginBottom:4}}>
              Sub in for {shownField[subSlot]?.num?`#${shownField[subSlot].num} `:""}{shownField[subSlot]?.name}
            </div>
            <div style={{fontSize:11,color:"#7aa0cc",marginBottom:12}}>Select from bench:</div>
            {shownBench.filter(p=>!p.ejected).length===0 && <div style={{color:"#4a6a8a",fontSize:13}}>{shownBench.length>0?"All bench players have been ejected":"No bench players"}</div>}
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {shownBench.filter(p=>!p.ejected&&!p.dns).map(p=>(
                <button key={p.id} onClick={safeClick(()=>doSub(p))} style={{...B.act("#15803d","#86efac"),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span>{p.num?`#${p.num} `:""}{p.name}</span>
                  <span style={{fontSize:11,color:"#86efac",marginLeft:8}}>▶{fmtS(p.totalMs)} 🪑{fmtS(p.benchMs)}</span>
                </button>
              ))}
            </div>
            <button onClick={safeClick(()=>{setModal(null);setSubSlot(null);})} style={B.cancel()}>Cancel</button>
          </div>
        </div>
      )}

      {/* Card */}
      {modal==="card" && cardSlot!==null && (
        <div style={S.overlay} onClick={safeClick(()=>{setModal(null);setCardSlot(null);})}>
          <div style={S.card} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:14,color:"#fff"}}>Card — {field[cardSlot]?.name}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={safeClick(()=>giveCard(cardSlot,"yellow"))} style={{...B.act("#b45309","#fde68a"),flex:1,textAlign:"center"}}>🟨 Yellow</button>
              <button onClick={safeClick(()=>giveCard(cardSlot,"red"))} style={{...B.act("#991b1b","#fca5a5"),flex:1,textAlign:"center"}}>🟥 Red</button>
            </div>
            <button onClick={safeClick(()=>{setModal(null);setCardSlot(null);})} style={B.cancel()}>Cancel</button>
          </div>
        </div>
      )}

      {/* Sub plan confirm modal */}
      {/* Bench player action (from table view tap) */}
      {modal==="dnsAction" && selSlot!==null && shownBench[selSlot] && (()=>{
        const bp = shownBench[selSlot];
        return (
          <div style={S.overlay} onClick={safeClick(()=>{setModal(null);setSelSlot(null);})}>
            <div style={S.card} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>{bp.num?`#${bp.num} `:""}{bp.name}</div>
              <div style={{fontSize:12,color:"#f59e0b",marginBottom:6}}>🚫 Did Not Show</div>
              <div style={{fontSize:11,color:"#4a6a8a",marginBottom:14}}>Mark this player as arrived to allow substitutions.</div>
              <button onClick={safeClick(()=>{
                setActiveBench(bx=>bx.map(b=>b.id===bp.id?{...b,dns:false}:b));
                if (!planning) addEvt(`✅ Arrived: ${bp.num?"#"+bp.num+" ":""}${bp.name} — now available`);
                setModal(null);setSelSlot(null);
              })} style={{...B.act("#15803d","#86efac"),marginBottom:8,textAlign:"center"}}>✅ Mark as Arrived</button>
              <button onClick={safeClick(()=>{setModal(null);setSelSlot(null);})} style={B.cancel()}>Cancel</button>
            </div>
          </div>
        );
      })()}

      {modal==="benchAction" && selSlot!==null && shownBench[selSlot] && (()=>{
        const bp = shownBench[selSlot];
        return (
          <div style={S.overlay} onClick={safeClick(()=>{setModal(null);setSelSlot(null);})}>
            <div style={S.card} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>{bp.num?`#${bp.num} `:""}{bp.name}</div>
              <div style={{fontSize:11,color:"#7aa0cc",marginBottom:14}}>
                Bench: {fmtS(bp.benchMs||0)} · Played: {fmtS(bp.totalMs||0)}
              </div>
              <div style={{fontSize:12,color:"#4a6a8a",marginBottom:10}}>Sub in for:</div>
              <div style={{display:"flex",flexDirection:"column",gap:7,maxHeight:260,overflowY:"auto"}}>
                {shownField.map((fp,slot)=>(
                  <button key={fp.id} onClick={safeClick(()=>{
                    // reuse doSub logic directly
                    const out=fp;
                    const inP=bp;
                    const outLabel=(out.num?"#"+out.num+" ":"")+out.name;
                    const inLabel=(inP.num?"#"+inP.num+" ":"")+inP.name;
                    setActiveField(fld=>{ const n=[...fld]; n[slot]={...inP,slot,isGK:out.isGK,shiftMs:0,totalMs:inP.totalMs||0,benchMs:inP.benchMs||0,gkMs:inP.gkMs||0,h1Ms:inP.h1Ms||0,h2Ms:inP.h2Ms||0}; return n; });
                    setActiveBench(bch=>bch.filter(x=>x.id!==inP.id).concat([{...out,benchMs:out.benchMs||0}]));
                    if (!planning) addEvt("🔄 "+inLabel+" IN for "+outLabel);
                    setModal(null); setSelSlot(null);
                  })} style={{...B.act("#1d4ed8","#93c5fd"),display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span>{fp.num?`#${fp.num} `:""}{fp.name}{fp.isGK?" ★":""}</span>
                    <span style={{fontSize:11,color:"#93c5fd",marginLeft:8}}>shift {fmtS(fp.shiftMs||0)}</span>
                  </button>
                ))}
              </div>
              {!bp.ejected && (
                <button onClick={safeClick(()=>{
                  const nowDns = !bp.dns;
                  setActiveBench(bx=>bx.map(b=>b.id===bp.id?{...b,dns:nowDns}:b));
                  if (nowDns) {
                    if (!planning) addEvt(`🚫 DNS: ${bp.num?"#"+bp.num+" ":""}${bp.name} — did not show`);
                  } else {
                    if (!planning) addEvt(`✅ Arrived: ${bp.num?"#"+bp.num+" ":""}${bp.name} — now available`);
                  }
                  setModal(null);setSelSlot(null);
                })} style={B.act(bp.dns?"#15803d":"#78350f",bp.dns?"#86efac":"#fcd34d")}>
                  {bp.dns ? "✅ Mark as Arrived" : "🚫 Mark Did Not Show"}
                </button>
              )}
              <button onClick={safeClick(()=>{setModal(null);setSelSlot(null);})} style={B.cancel()}>Cancel</button>
            </div>
          </div>
        );
      })()}

      {/* Sub plan summary */}
      {modal==="subPlanSummary" && planning && (
        <div style={S.overlay} onClick={()=>setModal(null)}>
          <div style={{...S.card,maxHeight:"82vh",overflowY:"auto",borderColor:"#f59e0b"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:800,fontSize:17,color:"#fbbf24",marginBottom:4}}>Sub Plan</div>
            <div style={{fontSize:11,color:"#7aa0cc",marginBottom:12}}>
              Shortest practical path from the current live lineup to the planned lineup.
            </div>
            {!subPlanSummary.hasChanges && (
              <div style={{background:"#071120",borderRadius:10,padding:"12px",color:"#93c5fd",fontSize:13,marginBottom:12}}>
                No lineup changes planned.
              </div>
            )}
            {subPlanSummary.ops.length > 0 && (
              <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:12}}>
                {subPlanSummary.ops.map((op,i)=>(
                  <div key={i} style={{background:"#071120",border:"1px solid #1e3a5f",borderRadius:10,padding:"9px 10px"}}>
                    <div style={{fontSize:10,color:op.type==="sub"?"#4ade80":"#fbbf24",fontWeight:800,letterSpacing:0.5,marginBottom:3}}>
                      {i+1}. {op.type==="sub"?"SUBSTITUTION":op.type==="swap"?"FIELD SWAP":"POSITION MOVE"}
                    </div>
                    <div style={{fontSize:13,color:"#e2e8f0",fontWeight:600}}>
                      {op.type==="sub"
                        ? `${playerLabel(op.inP)} IN for ${playerLabel(op.outP)}`
                        : op.type==="swap"
                          ? `${playerLabel(op.a)} ⇄ ${playerLabel(op.b)}`
                          : `${playerLabel(op.p)} to planned spot`}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <button onClick={executeSubPlan}
              disabled={!subPlanSummary.hasChanges}
              style={{...B.act(subPlanSummary.hasChanges?"#15803d":"#10251a",subPlanSummary.hasChanges?"#bbf7d0":"#315743"),textAlign:"center",marginBottom:8}}>
              Execute Sub
            </button>
            <button onClick={()=>setModal(null)} style={{...B.act("#f59e0b","#fff7ed"),textAlign:"center",marginBottom:8}}>
              Keep Planning
            </button>
            <button onClick={cancelSubPlanning} style={B.cancel()}>Cancel Plan</button>
          </div>
        </div>
      )}

      {/* Save stats confirm — shown when Menu pressed mid-game */}
      {modal==="saveStats" && (
        <div style={S.overlay} onClick={()=>{setModal(null);setScreen("setup");}}>
          <div style={S.card} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:800,fontSize:16,color:"#fff",marginBottom:8}}>Save game stats?</div>
            <div style={{fontSize:13,color:"#7aa0cc",marginBottom:16}}>
              Save this game's stats to the career player database before leaving?
            </div>
            <button onClick={()=>{saveGameToStats();setModal(null);setScreen("setup");}}
              style={{...B.act("#15803d","#86efac"),textAlign:"center",marginBottom:8}}>
              ✓ Save stats &amp; exit
            </button>
            <button onClick={()=>{setModal(null);setScreen("setup");}}
              style={{...B.act("#7f1d1d","#fca5a5"),textAlign:"center",marginBottom:8}}>
              ✗ Exit without saving
            </button>
            <button onClick={()=>setModal(null)} style={B.cancel()}>Cancel — stay in game</button>
          </div>
        </div>
      )}

      {/* Event log */}
      {modal==="log" && (
        <div style={S.overlay} onClick={safeClick(()=>setModal(null))}>
          <div style={{...S.card,maxHeight:"70vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:10,color:"#fff"}}>Event Log</div>
            {events.length===0 && <div style={{color:"#4a6a8a",fontSize:13}}>No events yet</div>}
            {[...events].reverse().map((ev,i)=>(
              <div key={i} style={{fontSize:12,padding:"5px 0",borderBottom:"1px solid #1e3a5f",color:"#93c5fd"}}>
                <span style={{color:"#4a6a8a",marginRight:8}}>{ev.time}</span>{ev.text}
              </div>
            ))}
            <button onClick={safeClick(()=>setModal(null))} style={B.cancel()}>Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Setup Screen ──────────────────────────────────────────────────────────────
function Setup({
  teamName, setTeamName, teamSize, roster,
  newName, setNewName, newNum, setNewNum,
  addPlayer, removePlayer, changeTeamSize,
  rosters, saveRoster, loadRoster, deleteRoster, setDefaultRoster, importRosterCSV,
  saveRosterName, setSaveRosterName, rosterModal, setRosterModal,
  savedGames, deleteGame, loadGameSummary, exportGameCSV,
  gameListModal, setGameListModal,
  gameSetups, gameSetupModal, setGameSetupModal,
  saveGameSetup, loadGameSetup, deleteGameSetup, lastLoadedSetupName,
  selectedPlayers, togglePlayerSelected, selectAllPlayers, clearAllSelected, selectPlayersByTeam,
  h1Formation, h2Formation, openFormation,
  gameInProgress, onReturnToGame,
  opponent, setOpponent, gameDate, setGameDate, competition, setCompetition,
  settingsModal, setSettingsModal, showJerseyNum, setShowJerseyNum,
  showPlayerTeam, setShowPlayerTeam,
  showHalfCols, setShowHalfCols,
  snapToGrid, setSnapToGrid, showGrid, setShowGrid,
  subPlanMode, setSubPlanMode,
  statsModal, setStatsModal, playerStats, setPlayerStats,
}) {
  const numSelected = selectedPlayers.size;
  const enough = numSelected >= teamSize;
  const [csvError, setCsvError] = useState("");
  const [rosterTab, setRosterTab] = useState("list"); // "list"|"save"|"import"
  const [saveSetupName, setSaveSetupName] = useState("");
  const [rosterSort, setRosterSort] = useState("roster"); // "roster"|"num"|"first"|"last"
  const [teamSelectModal, setTeamSelectModal] = useState(false);
  const rosterTeams = [...new Set(roster.map(p => normalizeTeamName(p.team)).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

  const S2 = (bg,tc) => ({padding:"7px 12px",borderRadius:8,border:"none",
    background:bg,color:tc,fontWeight:600,fontSize:12,cursor:"pointer",flexShrink:0});

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#071120",height:"100dvh",overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",color:"#fff",padding:"14px",paddingBottom:"calc(18px + env(safe-area-inset-bottom))",maxWidth:480,margin:"0 auto"}}>

      {/* ── Header ── */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:22}}>⚽</span>
          <span style={{fontSize:18,fontWeight:800,color:"#60a5fa"}}>Sub Tracker</span>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setStatsModal(true)} style={S2("#0d1f3c","#34d399")}>📊 Stats</button>
          <button onClick={()=>setSettingsModal(true)} style={S2("#0d1f3c","#fbbf24")}>⚙</button>
        </div>
      </div>

      {/* ── ROSTER SECTION ── */}
      <div style={{background:"#0d1f3c",borderRadius:12,padding:"12px 14px",marginBottom:12,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <span style={{fontSize:13,fontWeight:700,color:"#60a5fa"}}>👥 Roster</span>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setRosterModal(true)} style={S2("#1e3a5f","#93c5fd")}>📂 Load</button>
            <button onClick={()=>{ setSaveRosterName(teamName); setRosterModal("save"); }}
              disabled={roster.length===0}
              style={S2(roster.length===0?"#0d1a2a":"#1e3a5f",roster.length===0?"#4a6a8a":"#93c5fd")}>
              💾 Save
            </button>
          </div>
        </div>

        <input value={teamName} onChange={e=>setTeamName(e.target.value)}
          style={{...B.inp(),marginBottom:8,fontSize:15,fontWeight:700}}
          placeholder="Team name"/>

        <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
          <input value={newNum} onChange={e=>setNewNum(e.target.value)}
            style={{...B.inp(),width:46,marginBottom:0,textAlign:"center",flexShrink:0,padding:"9px 4px"}}
            placeholder="#"/>
          <input value={newName} onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addPlayer()}
            style={{...B.inp(),flex:1,marginBottom:0}} placeholder="Player name"/>
          <button onClick={addPlayer}
            style={{background:"#1d4ed8",border:"none",color:"#fff",padding:"9px 12px",
              borderRadius:9,fontWeight:700,fontSize:13,cursor:"pointer",flexShrink:0}}>
            + Add
          </button>
        </div>

        {/* Team size */}
        <div style={{display:"flex",gap:6,marginBottom:8}}>
          {[7,9,11].map(n=>(
            <button key={n} onClick={()=>changeTeamSize(n)}
              style={{flex:1,padding:"8px 0",borderRadius:8,
                border:teamSize===n?"2px solid #3b82f6":"1px solid #1e3a5f",
                background:teamSize===n?"#1d4ed8":"#071120",
                color:teamSize===n?"#fff":"#7aa0cc",fontWeight:700,fontSize:14,cursor:"pointer"}}>
              {n}v{n}
            </button>
          ))}
        </div>

        {/* Player list with game selection */}
        {roster.length > 0 && (
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,gap:4}}>
            <span style={{fontSize:9,color:"#4a6a8a",fontWeight:700,letterSpacing:0.5,flexShrink:0}}>
              {selectedPlayers.size}/{roster.length} in game
            </span>
            <div style={{display:"flex",gap:3,flex:1,justifyContent:"center"}}>
              {[["roster","Order"],["num","#"],["first","First"],["last","Last"]].map(([k,l])=>(
                <button key={k} onClick={()=>setRosterSort(k)}
                  style={{fontSize:9,padding:"2px 6px",borderRadius:5,border:"none",
                    background:rosterSort===k?"#1d4ed8":"#1e3a5f",
                    color:rosterSort===k?"#fff":"#7aa0cc",cursor:"pointer",fontWeight:rosterSort===k?700:400}}>
                  {l}
                </button>
              ))}
            </div>
            <div style={{display:"flex",gap:4,flexShrink:0}}>
              {rosterTeams.length>0 && <button onClick={()=>setTeamSelectModal(true)}
                style={{fontSize:9,padding:"2px 6px",borderRadius:5,border:"none",
                  background:"#0e7490",color:"#cffafe",cursor:"pointer",fontWeight:700}}>Team</button>}
              <button onClick={selectAllPlayers}
                style={{fontSize:9,padding:"2px 6px",borderRadius:5,border:"none",
                  background:"#1e3a5f",color:"#93c5fd",cursor:"pointer"}}>All</button>
              <button onClick={clearAllSelected}
                style={{fontSize:9,padding:"2px 6px",borderRadius:5,border:"none",
                  background:"#1e3a5f",color:"#7aa0cc",cursor:"pointer"}}>None</button>
            </div>
          </div>
        )}
        <div style={{height:200,overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",display:"flex",flexDirection:"column",gap:3,flexShrink:0,contain:"layout paint"}}>
          {(()=>{
            const sorted = [...roster].sort((a,b)=>{
              if(rosterSort==="num") return (parseInt(a.num)||999)-(parseInt(b.num)||999);
              if(rosterSort==="first") return a.name.localeCompare(b.name);
              if(rosterSort==="last") return (a.lastName||a.name).localeCompare(b.lastName||b.name);
              return 0; // "roster" = original order
            });
            return sorted;
          })().map((p,i)=>{
            const inGame = selectedPlayers.has(p.id);
            const tColor = showPlayerTeam && p.team ? teamColor(p.team) : null;
            return (
              <div key={p.id} style={{display:"flex",alignItems:"center",gap:0,
                background:tColor ? tColor.bg : inGame?"#0d2a4a":"#071120",
                borderRadius:7,border:tColor ? "1px solid "+tColor.border : inGame?"1px solid #1e4a7a":"1px solid transparent",
                overflow:"hidden",flexShrink:0,minHeight:36}}>
                {/* Selection toggle */}
                <button onClick={()=>togglePlayerSelected(p.id)}
                  style={{width:34,alignSelf:"stretch",background:inGame?"#1d4ed8":"#0a1a2e",
                    border:"none",borderRight:"1px solid #0d1f3c",cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:14,color:inGame?"#fff":"#2d4a6a",flexShrink:0}}>
                  {inGame?"✓":""}
                </button>
                {/* Player info */}
                <div style={{display:"flex",alignItems:"center",gap:6,flex:1,padding:"6px 8px"}}>
                  <span style={{fontSize:12,color:inGame?"#60a5fa":"#2d4a7a",fontWeight:700,minWidth:24}}>
                    {p.num?`#${p.num}`:`#${i+1}`}
                  </span>
                  <span style={{fontSize:13,flex:1,color:inGame?"#e2e8f0":"#4a6a8a",fontWeight:inGame?500:400}}>
                    {p.name}{p.lastName?" "+p.lastName:""}
                    {tColor && <span style={{fontSize:9,color:tColor.text,marginLeft:6,fontWeight:700}}>{p.team}</span>}
                  </span>
                  <button onClick={()=>removePlayer(p.id)}
                    style={{background:"transparent",border:"none",color:"#7f1d1d",
                      cursor:"pointer",fontSize:16,lineHeight:1,padding:0}}>×</button>
                </div>
              </div>
            );
          })}
          {roster.length===0 && (
            <div style={{color:"#4a6a8a",fontSize:12,textAlign:"center",padding:12}}>
              No players — add above or load a roster.
            </div>
          )}
        </div>
      </div>

      {/* ── GAME SECTION ── */}
      <div style={{background:"#0d1f3c",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <span style={{display:"flex",alignItems:"center",gap:6,fontSize:13,fontWeight:700,color:"#a78bfa"}}>
            <svg width="28" height="20" viewBox="0 0 56 40" xmlns="http://www.w3.org/2000/svg"
              style={{flexShrink:0}}>
              <rect width="56" height="40" rx="3" fill="#1a6b32"/>
              <rect x="1.5" y="1.5" width="53" height="37" rx="2" fill="none" stroke="#2d8a4a" strokeWidth="1"/>
              <line x1="28" y1="1.5" x2="28" y2="38.5" stroke="#2d8a4a" strokeWidth="1"/>
              <circle cx="28" cy="20" r="6" fill="none" stroke="#2d8a4a" strokeWidth="1"/>
              <circle cx="28" cy="20" r="1" fill="#2d8a4a"/>
              <rect x="1.5" y="13" width="7" height="14" rx="1" fill="none" stroke="#2d8a4a" strokeWidth="1"/>
              <rect x="47.5" y="13" width="7" height="14" rx="1" fill="none" stroke="#2d8a4a" strokeWidth="1"/>
              <rect x="1.5" y="16" width="3" height="8" rx="1" fill="none" stroke="#2d8a4a" strokeWidth="0.8"/>
              <rect x="51.5" y="16" width="3" height="8" rx="1" fill="none" stroke="#2d8a4a" strokeWidth="0.8"/>
            </svg>
            Game
          </span>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setGameSetupModal("load")} style={S2("#1e3a5f","#c4b5fd")}>📂 Load</button>
            <button onClick={()=>{ setSaveSetupName(lastLoadedSetupName || (teamName+" vs "+(opponent||"TBD"))); setGameSetupModal("save"); }} style={S2("#1e3a5f","#c4b5fd")}>💾 Save</button>
            <button onClick={()=>setGameListModal(true)} style={S2("#1e3a5f","#a78bfa")}>📋 Past</button>
          </div>
        </div>

        <input value={opponent} onChange={e=>setOpponent(e.target.value)}
          style={{...B.inp(),marginBottom:8}} placeholder="Opponent"/>
        <input value={competition} onChange={e=>setCompetition(e.target.value)}
          style={{...B.inp(),marginBottom:8}} placeholder="Competition (League / Cup / Friendly)"/>
        <input value={gameDate} onChange={e=>setGameDate(e.target.value)}
          style={{...B.inp(),marginBottom:10}}
          placeholder={new Date().toLocaleDateString()}/>

        {gameInProgress && (
          <button onClick={onReturnToGame}
            style={{width:"100%",padding:"11px",borderRadius:10,border:"2px solid #4ade80",
              background:"#14532d",color:"#4ade80",fontWeight:700,fontSize:14,
              cursor:"pointer",marginBottom:10}}>
            ▶ Return to Current Game
          </button>
        )}

        {!enough ? (
          <div style={{textAlign:"center",color:"#4a6a8a",fontSize:12,padding:"8px 0"}}>
            Select {teamSize-numSelected} more player(s) to plan formations (have {numSelected} of {teamSize} needed)
          </div>
        ) : (
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>openFormation("h1")}
              style={{flex:1,padding:"12px 0",borderRadius:10,border:"none",
                background:h1Formation?"#1d4ed8":"#0d3a7c",color:"#bfdbfe",
                fontWeight:700,fontSize:13,cursor:"pointer"}}>
              {h1Formation?"✓ ":""}1st Half
              <div style={{fontSize:9,color:"#93c5fd",marginTop:2,fontWeight:400}}>Formation</div>
            </button>
            <button onClick={()=>openFormation("h2")}
              style={{flex:1,padding:"12px 0",borderRadius:10,border:"none",
                background:h2Formation?"#15803d":"#0a3d1f",color:"#bbf7d0",
                fontWeight:700,fontSize:13,cursor:"pointer"}}>
              {h2Formation?"✓ ":""}2nd Half
              <div style={{fontSize:9,color:"#86efac",marginTop:2,fontWeight:400}}>Formation</div>
            </button>
          </div>
        )}
      </div>

      {/* ── TEAM SELECTION MODAL ── */}
      {teamSelectModal && (
        <div style={S.overlay} onClick={()=>setTeamSelectModal(false)}>
          <div style={{...S.card,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:15,color:"#fff",marginBottom:4}}>Select Players By Team</div>
            <div style={{fontSize:11,color:"#7aa0cc",marginBottom:12}}>
              Selects everyone with the chosen team label for this game.
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {rosterTeams.map(team => {
                const c = teamColor(team);
                const count = roster.filter(p => normalizeTeamName(p.team) === team).length;
                return (
                  <button key={team} onClick={()=>{
                    selectPlayersByTeam(team);
                    setTeamSelectModal(false);
