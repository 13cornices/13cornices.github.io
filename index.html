// ── Formation Planner Screen ──────────────────────────────────────────────────
// Shared field editor used for both h1 and h2 formation planning.
// Uses the same SVG drag logic as the game screen.
function FormationPlanner({ which, field, bench, pos, goals, setField, setBench, setPos, teamName, teamSize, showJerseyNum, snapToGrid, showGrid, lineConfig, setLineConfig, onSave, onLaunch, onOther, onMenu, otherLabel, isH2 }) {
  const svgRef2       = useRef(null);
  const dragRef       = useRef(null);   // field circle drag
  const benchDragRef2 = useRef(null);   // bench→field drag
  const modalOpenedAt2 = useRef(0);
  const FIELD_W2 = 360, FIELD_H2 = 460;

  const [drag, setDragL]           = useState(null);
  const [selSlot, setSelSlot]       = useState(null);
  const [modal, setModal]           = useState(null);
  const [benchDragState2, setBDS2]  = useState(null); // {benchIdx, x, y, hoverSlot}
  const [fpFieldHover, setFpFieldHover] = useState(null); // slot hovered during field drag
  const [fpBlink, setFpBlink]       = useState(null);
  const [fpBlink2, setFpBlink2]     = useState(null);

  // ── Field circle drag — window-level so it works into bench area ────────────
  const benchContRef2 = useRef(null);
  const [fieldDrag2Ghost, setFieldDrag2Ghost] = useState(null); // {x,y,name,num}
  const [fieldDragOver2, setFieldDragOver2]   = useState(null); // hovered bench origIdx

  function svgPt2(clientX, clientY) {
    const svg = svgRef2.current; if (!svg) return null;
    const r = svg.getBoundingClientRect();
    return { x:((clientX-r.left)/r.width)*FIELD_W2, y:((clientY-r.top)/r.height)*FIELD_H2 };
  }

  function getFpFieldSlot(clientX, clientY, excludeSlot) {
    const svg = svgRef2.current; if (!svg) return null;
    const r = svg.getBoundingClientRect();
    const sx = ((clientX-r.left)/r.width)*FIELD_W2;
    const sy = ((clientY-r.top)/r.height)*FIELD_H2;
    let best=null, bestD=38;
    field.forEach((_,slot)=>{
      if(slot===excludeSlot) return;
      const fp=pos[slot]||{x:50,y:50};
      const d=Math.hypot(sx-fp.x,sy-fp.y);
      if(d<bestD){bestD=d;best=slot;}
    });
    return best;
  }

  function getBenchIdx2(clientX, clientY) {
    const bc = benchContRef2.current; if (!bc) return null;
    const r = bc.getBoundingClientRect();
    if (clientY<r.top||clientY>r.bottom||clientX<r.left||clientX>r.right) return null;
    let found=null;
    bc.querySelectorAll('[data-benchidx2]').forEach(el=>{
      const er=el.getBoundingClientRect();
      if(clientX>=er.left&&clientX<=er.right&&clientY>=er.top&&clientY<=er.bottom)
        found=parseInt(el.getAttribute('data-benchidx2'));
    });
    return found;
  }

  useEffect(()=>{
    if(!drag) return;
    function mv(e){
      const t=e.touches?.[0]||e; const cx=t.clientX,cy=t.clientY;
      const d=dragRef.current; if(!d) return;
      if(!d.moved&&Math.hypot(cx-d.sc.x,cy-d.sc.y)<12) return;
      if(e.cancelable) e.preventDefault();
      const pt=svgPt2(cx,cy);
      if(pt) setPos(ps=>({...ps,[d.slot]:{x:pt.x-d.ox,y:pt.y-d.oy}}));
      const bIdx2=getBenchIdx2(cx,cy);
      setFieldDragOver2(bIdx2);
      setFpFieldHover(bIdx2!==null ? null : getFpFieldSlot(cx,cy,d.slot));
      dragRef.current={...d,moved:true,clientX:cx,clientY:cy};
      setDragL(dv=>dv?{...dv,moved:true,clientX:cx,clientY:cy}:dv);
    }
    function up(e){
      const t=e.changedTouches?.[0]||e;
      const d=dragRef.current; dragRef.current=null;
      setFieldDragOver2(null); setFieldDrag2Ghost(null); setFpFieldHover(null);
      window.removeEventListener('pointermove',mv);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('touchmove',mv);
      window.removeEventListener('touchend',up);
      if(!d){setDragL(null);return;}
      if(!d.moved){
        modalOpenedAt2.current=Date.now(); setSelSlot(d.slot); setModal("player");
        setDragL(null); return;
      }
      setFpFieldHover(null);
      // Check field-to-field swap first
      const tSlot=getFpFieldSlot(t.clientX,t.clientY,d.slot);
      if(tSlot!==null&&field[tSlot]){
        const startP=d.startPos;
        setPos(ps=>{
          const tPos=ps[tSlot]||{x:50,y:50};
          return{...ps,[d.slot]:{...tPos},[tSlot]:{...startP}};
        });
        // Flip isGK for both if either was GK
        setField(fp=>{
          const n=[...fp];
          if(n[d.slot]&&n[tSlot]&&(n[d.slot].isGK||n[tSlot].isGK)){
            n[d.slot]  ={...n[d.slot],  isGK:!n[d.slot].isGK};
            n[tSlot]   ={...n[tSlot],   isGK:!n[tSlot].isGK};
          }
          return n;
        });
        setFpBlink(d.slot); setFpBlink2(tSlot);
        setTimeout(()=>{setFpBlink(null);setFpBlink2(null);},800);
        setDragL(null); return;
      }
      const bIdx=getBenchIdx2(t.clientX,t.clientY);
      if(bIdx!==null&&bench[bIdx]&&!bench[bIdx].ejected){
        const outSlot=d.slot, out=field[outSlot], inP=bench[bIdx];
        if(out&&inP){
          setPos(ps=>({...ps,[outSlot]:d.startPos}));
          setField(fp=>{const n=[...fp];n[outSlot]={...inP,slot:outSlot,isGK:out.isGK,shiftMs:0,totalMs:0,benchMs:0,gkMs:0,h1Ms:0,h2Ms:0};return n;});
          setBench(bp=>bp.filter(x=>x.id!==inP.id).concat([{...out,shiftMs:0,totalMs:0,benchMs:0,gkMs:0,h1Ms:0,h2Ms:0}]));
        }
        setDragL(null); return;
      }
      // Clamp back inside field on normal drop, then optionally snap to grid
      setPos(ps=>{
        const c=ps[d.slot]||{x:50,y:50};
        const cx=Math.max(20,Math.min(FIELD_W2-20,c.x));
        const cy=Math.max(20,Math.min(FIELD_H2-20,c.y));
        const finalPos = snapToGrid ? snapToNearestGridPoint(cx,cy,lineConfig) : {x:cx,y:cy};
        return{...ps,[d.slot]:finalPos};
      });
      setDragL(null);
    }
    window.addEventListener('pointermove',mv,{passive:true});
    window.addEventListener('pointerup',up);
    window.addEventListener('touchmove',mv,{passive:false});
    window.addEventListener('touchend',up);
    return()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('touchmove',mv);window.removeEventListener('touchend',up);};
  },[drag,field,bench,pos,snapToGrid,lineConfig]);

  function onCircleDown(e,slot){
    e.stopPropagation(); e.preventDefault();
    const t=e.touches?.[0]||e;
    const p=pos[slot]||{x:50,y:50};
    const pt=svgPt2(t.clientX,t.clientY);
    const player=field[slot];
    const d={slot,startPos:{...p},sc:{x:t.clientX,y:t.clientY},ox:pt?pt.x-p.x:0,oy:pt?pt.y-p.y:0,moved:false,name:player?.name||"",num:player?.num||""};
    dragRef.current=d; setDragL({slot});
  }

  function onSVGMove(e){ if(benchDragRef2.current) onBenchMove2(e); }
  function onSVGUp(e)  { if(benchDragRef2.current) onBenchUp2(e);  }

  // ── Bench→field drag ─────────────────────────────────────────────────────────
  function getSlotAt2(clientX, clientY) {
    const svg = svgRef2.current; if (!svg) return null;
    const r = svg.getBoundingClientRect();
    const sx = ((clientX-r.left)/r.width)*FIELD_W2;
    const sy = ((clientY-r.top)/r.height)*FIELD_H2;
    let best=null, bestD=44;
    field.forEach((_, slot) => {
      const fp = pos[slot]||{x:50,y:50};
      const d = Math.hypot(sx-fp.x, sy-fp.y);
      if (d < bestD) { bestD=d; best=slot; }
    });
    return best;
  }

  function onBenchDown2(e, benchIdx) {
    if (bench[benchIdx]?.ejected) return;
    // DNS players: only allow tap (to open dnsAction), not drag
    if (bench[benchIdx]?.dns) {
      e.preventDefault(); e.stopPropagation();
      const t = e.touches?.[0]||e;
      // Store minimal state for tap detection only
      benchDragRef2.current = { benchIdx, x:t.clientX, y:t.clientY,
        startX:t.clientX, startY:t.clientY, hoverSlot:null, isDns:true };
      setBDS2({ benchIdx, x:t.clientX, y:t.clientY, hoverSlot:null });
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_) {}
      return;
    }
    e.preventDefault(); e.stopPropagation();
    const t = e.touches?.[0]||e;
    benchDragRef2.current = { benchIdx, x:t.clientX, y:t.clientY,
      startX:t.clientX, startY:t.clientY, hoverSlot:null };
    setBDS2({ benchIdx, x:t.clientX, y:t.clientY, hoverSlot:null });
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_) {}
  }

  function onBenchMove2(e) {
    const bd = benchDragRef2.current; if (!bd) return;
    // DNS players don't show hover highlights
    if (bd.isDns) return;
    if (e.cancelable) e.preventDefault();
    const t = e.touches?.[0]||e;
    const slot = getSlotAt2(t.clientX, t.clientY);
    benchDragRef2.current = {...bd, x:t.clientX, y:t.clientY, hoverSlot:slot};
    setBDS2({ benchIdx:bd.benchIdx, x:t.clientX, y:t.clientY, hoverSlot:slot });
  }

  function onBenchUp2(e) {
    const bd = benchDragRef2.current;
    benchDragRef2.current = null; setBDS2(null);
    if (!bd) return;
    const t = e.changedTouches?.[0]||e;
    // Tap detection: open modal
    const moved = Math.hypot(t.clientX-(bd.startX||bd.x), t.clientY-(bd.startY||bd.y));
    if (moved < 12) {
      modalOpenedAt2.current = Date.now();
      setSelSlot(bd.benchIdx);
      setModal(bench[bd.benchIdx]?.dns ? "dnsAction" : "benchAction");
      return;
    }
    // DNS players cannot be dragged to field
    if (bd.isDns || bench[bd.benchIdx]?.dns) return;
    const slot = getSlotAt2(t.clientX, t.clientY);
    if (slot === null) return;
    const benchP = bench[bd.benchIdx];
    const out = field[slot];
    if (!benchP || !out) return;
    // Swap bench player into slot, field player goes to bench
    setField(fp => { const n=[...fp]; n[slot]={...benchP,slot,isGK:out.isGK,shiftMs:0,totalMs:0,benchMs:0,gkMs:0,h1Ms:0,h2Ms:0}; return n; });
    setBench(bp => bp.filter(x=>x.id!==benchP.id).concat([{...out,shiftMs:0,totalMs:0,benchMs:0,gkMs:0,h1Ms:0,h2Ms:0}]));
  }

  useEffect(() => {
    if (!benchDragState2) return;
    function handleBenchMove2(e) { onBenchMove2(e); }
    function handleBenchUp2(e) { onBenchUp2(e); }
    window.addEventListener('pointermove', handleBenchMove2);
    window.addEventListener('pointerup', handleBenchUp2);
    window.addEventListener('touchmove', handleBenchMove2, { passive:false });
    window.addEventListener('touchend', handleBenchUp2);
    return () => {
      window.removeEventListener('pointermove', handleBenchMove2);
      window.removeEventListener('pointerup', handleBenchUp2);
      window.removeEventListener('touchmove', handleBenchMove2);
      window.removeEventListener('touchend', handleBenchUp2);
    };
  }, [benchDragState2, field, bench, pos]);

  // ── Swap via modal (tap player → pick from bench list) ───────────────────────
  // FIX: capture the slot at the time the button is tapped, don't rely on async state
  function doSwap(outSlot, benchP) {
    const out = field[outSlot];
    if (!out) return;
    setField(fp => { const n=[...fp]; n[outSlot]={...benchP,slot:outSlot,isGK:out.isGK,shiftMs:0,totalMs:0,benchMs:0,gkMs:0,h1Ms:0,h2Ms:0}; return n; });
    setBench(bp => bp.filter(x=>x.id!==benchP.id).concat([{...out,shiftMs:0,totalMs:0,benchMs:0,gkMs:0,h1Ms:0,h2Ms:0}]));
    setModal(null); setSelSlot(null);
  }

  function toggleGK2(slot) {
    setField(fp => fp.map((p,i) => ({...p, isGK: i===slot ? !p.isGK : false})));
    setModal(null); setSelSlot(null);
  }

  function safeClick2(fn) { return () => { if (Date.now()-modalOpenedAt2.current < 350) return; fn(); }; }

  const selP = selSlot !== null ? field[selSlot] : null;
  const label = which==="h1" ? "1st Half Formation" : "2nd Half Formation";
  const accentCol = which==="h1" ? "#3b82f6" : "#22c55e";
  const circleCol = which==="h1" ? "#1e3a8a" : "#14532d";
  const strokeCol = which==="h1" ? "#60a5fa" : "#4ade80";
  const textCol   = which==="h1" ? "#93c5fd" : "#86efac";

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#071120",height:"100dvh",maxHeight:"100dvh",color:"#fff",display:"flex",flexDirection:"column",userSelect:"none",maxWidth:480,margin:"0 auto",overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain"}}
      onPointerMove={e => { if(benchDragRef2.current) onBenchMove2(e); }}
      onPointerUp={e => { if(benchDragRef2.current) onBenchUp2(e); }}
      onPointerCancel={() => { benchDragRef2.current=null; setBDS2(null); }}
    >
      {/* Header — just the title and hint */}
      <div style={{background:"#0d1f3c",borderBottom:"1px solid #1e3a5f",flexShrink:0,padding:"7px 10px 6px"}}>
        <span style={{fontSize:14,color:accentCol,fontWeight:800}}>{label}</span>
        <div style={{fontSize:10,color:"#4a6a8a",marginTop:2}}>
          Drag to arrange · Drag bench↔field to swap · Tap to assign GK
        </div>
      </div>

      {/* Field */}
      <div style={{flex:"1 1 280px",display:"flex",justifyContent:"center",padding:"2px 4px 0",overflow:"hidden",minHeight:260}}>
        <svg ref={svgRef2} viewBox={`0 0 ${FIELD_W2} ${FIELD_H2}`}
          style={{width:"100%",maxWidth:440,height:"100%",maxHeight:"100%",touchAction:"pan-y",cursor:"default",overflow:"visible"}}
          onPointerMove={onSVGMove} onPointerUp={onSVGUp} onPointerCancel={onSVGUp}
        >
          <rect width={FIELD_W2} height={FIELD_H2} fill="#1a4a2a" rx="8"/>
          <rect x={8} y={8} width={FIELD_W2-16} height={FIELD_H2-16} fill="none" stroke="#2d7a45" strokeWidth="1.5" rx="5"/>
          <line x1={8} y1={FIELD_H2/2} x2={FIELD_W2-8} y2={FIELD_H2/2} stroke="#2d7a45" strokeWidth="1"/>
          <circle cx={FIELD_W2/2} cy={FIELD_H2/2} r={36} fill="none" stroke="#2d7a45" strokeWidth="1"/>
          <rect x={FIELD_W2/2-55} y={8} width={110} height={73} fill="none" stroke="#2d7a45" strokeWidth="1"/>
          <rect x={FIELD_W2/2-55} y={FIELD_H2-81} width={110} height={73} fill="none" stroke="#2d7a45" strokeWidth="1"/>
          <rect x={FIELD_W2/2-25} y={1} width={50} height={10} fill="none" stroke="#3da05a" strokeWidth="1.5"/>
          <rect x={FIELD_W2/2-25} y={FIELD_H2-11} width={50} height={10} fill="none" stroke="#3da05a" strokeWidth="1.5"/>

          {/* Grid points overlay */}
          {showGrid && gridPoints(lineConfig).map((pt, i) => (
            <g key={"gp"+i}>
              <circle cx={pt.x} cy={pt.y} r={6} fill="none" stroke="rgba(255,255,255,0.25)" strokeWidth="1.5"/>
              <circle cx={pt.x} cy={pt.y} r={1.5} fill="rgba(255,255,255,0.35)"/>
            </g>
          ))}

          {/* +/- row buttons — one per non-GK line (lineConfig rows 0-3) */}
          {lineConfig && lineConfig.map((count, li) => {
            // li=0→defenders(row1), li=1→def-mid(row2), li=2→att-mid(row3), li=3→forwards(row4)
            // Row y: row 0=GK at bottom, row 4=fwd at top; total 5 rows
            const numRows = 5;
            const rowIdx = li + 1; // skip GK row
            const t = rowIdx / (numRows - 1);
            const yTop = 44, yBottom = FIELD_H2 - 44;
            const y = yBottom - t * (yBottom - yTop);
            const btnR = 11;
            const canAdd = count < 5;
            const canSub = count > 1;
            return (
              <g key={"linebtn"+li}>
                {/* Minus button — left side */}
                <circle cx={18} cy={y} r={btnR} fill={canSub?"#1e3a5f":"#0d1f3c"} stroke={canSub?"#4a7fc1":"#1e3a5f"} strokeWidth="1.5"
                  style={{cursor:canSub?"pointer":"default"}}
                  onClick={e=>{ e.stopPropagation(); if(!canSub) return;
                    const next = lineConfig.map((v,i)=>i===li?v-1:v);
                    setLineConfig(next);
                  }}
                />
                <text x={18} y={y+4.5} textAnchor="middle" fontSize="14" fontWeight="800"
                  fill={canSub?"#93c5fd":"#2a4a6a"} style={{pointerEvents:"none",userSelect:"none"}}>−</text>

                {/* Count label */}
                <text x={FIELD_W2/2} y={y-16} textAnchor="middle" fontSize="9" fill="rgba(255,255,255,0.35)"
                  style={{pointerEvents:"none",userSelect:"none"}}>
                  {["DEF","DM","AM","FWD"][li]} {count}
                </text>

                {/* Plus button — right side */}
                <circle cx={FIELD_W2-18} cy={y} r={btnR} fill={canAdd?"#1e3a5f":"#0d1f3c"} stroke={canAdd?"#4a7fc1":"#1e3a5f"} strokeWidth="1.5"
                  style={{cursor:canAdd?"pointer":"default"}}
                  onClick={e=>{ e.stopPropagation(); if(!canAdd) return;
                    const next = lineConfig.map((v,i)=>i===li?v+1:v);
                    setLineConfig(next);
                  }}
                />
                <text x={FIELD_W2-18} y={y+4.5} textAnchor="middle" fontSize="14" fontWeight="800"
                  fill={canAdd?"#93c5fd":"#2a4a6a"} style={{pointerEvents:"none",userSelect:"none"}}>+</text>
              </g>
            );
          })}

          {field.map((player, slot) => {
            if (drag?.moved && slot === drag.slot) return null; // rendered last
            const p = pos[slot] || {x:50,y:50};
            const isSel = selSlot===slot;
            const isHover = benchDragState2?.hoverSlot===slot;
            const nm = player.name.length>10 ? player.name.slice(0,9)+"…" : player.name;
            const numLabel = showJerseyNum && player.num ? " #"+player.num : "";
            return (
              <g key={player.id} onPointerDown={e=>onCircleDown(e,slot)} style={{cursor:"grab",touchAction:"none"}}>
                <circle cx={p.x} cy={p.y} r={40} fill="transparent" stroke="none"/>
                {/* Bench hover highlight */}
                {isHover && <circle cx={p.x} cy={p.y} r={34} fill="none" stroke="#4ade80" strokeWidth="3" strokeDasharray="6 3"/>}
                {/* Field-to-field swap hover */}
                {fpFieldHover===slot && drag?.moved && (
                  <circle cx={p.x} cy={p.y} r={34} fill="none" stroke="#f59e0b" strokeWidth="3" strokeDasharray="6 3"/>
                )}
                {/* Swap blink */}
                {(fpBlink===slot||fpBlink2===slot) && (
                  <circle cx={p.x} cy={p.y} r={34} fill="none" stroke="#4ade80" strokeWidth="4"
                    style={{animation:"subBlink 0.4s ease-in-out 2"}}/>
                )}
                {player.isGK && <circle cx={p.x} cy={p.y} r={35} fill="none" stroke="#fbbf24" strokeWidth="3" strokeDasharray="6 3"/>}
                <circle cx={p.x} cy={p.y} r={29}
                  fill={isHover?"#14532d":isSel?"#1e40af":circleCol}
                  stroke={isHover?"#4ade80":isSel?"#93c5fd":strokeCol}
                  strokeWidth={isSel||isHover?3:2}
                />
                <text x={p.x} y={p.y+2} textAnchor="middle" dominantBaseline="middle" fontSize="12" fill="#fff" fontWeight="700">{nm}</text>
                {showJerseyNum && player.num && <text x={p.x} y={p.y+16} textAnchor="middle" fontSize="9" fill={textCol}>#{player.num}</text>}
                {player.isGK && <text x={p.x} y={p.y-18} textAnchor="middle" fontSize="8" fill="#fbbf24" fontWeight="700">GK</text>}
              </g>
            );
          })}

        </svg>
      </div>

      {/* Bench — drag from field or from bench onto field */}
      <div ref={benchContRef2} style={{padding:"5px 10px 6px",background:"#050e1e",borderTop:"1px solid #0d1f3c",flexShrink:0}}>
        <div style={{fontSize:9,color:"#4a6a8a",marginBottom:5,fontWeight:700,letterSpacing:1}}>BENCH — drag to/from field to swap positions</div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {[...bench].sort((a,b)=>a.ejected&&!b.ejected?1:!a.ejected&&b.ejected?-1:0).map((p, bi) => {
            const origIdx = bench.findIndex(x=>x.id===p.id);
            const isDragging = benchDragState2?.benchIdx===origIdx;
            const isTargeted = fieldDragOver2===origIdx;
            const nm = p.name.length>8 ? p.name.slice(0,7)+"…" : p.name;
            return (
              <div key={p.id}
                data-benchidx2={origIdx}
                onPointerDown={e=>onBenchDown2(e, origIdx)}
                style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"grab",touchAction:"none",opacity:isDragging?0.35:1}}
              >
                <svg width="58" height="58" viewBox="0 0 58 58">
                  {isTargeted&&<circle cx={29} cy={29} r={28} fill="none" stroke="#4ade80" strokeWidth="2.5" strokeDasharray="5 3"/>}
                  <circle cx={29} cy={29} r={25}
                    fill={isTargeted?"#14532d":p.dns?"#1a1a0a":"#1e3a5f"}
                    stroke={isDragging?"#60a5fa":isTargeted?"#4ade80":p.dns?"#a16207":"#2d5a8f"}
                    strokeWidth={isDragging||isTargeted?2.5:1.5}/>
                  {p.dns
                    ? <text x={29} y={29} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="#a16207" fontWeight="700">{p.num||"?"}</text>
                    : <text x={29} y={29} textAnchor="middle" dominantBaseline="middle" fontSize="12" fill="#93c5fd" fontWeight="600">{nm}</text>
                  }
                  {!p.dns&&showJerseyNum&&p.num&&<text x={29} y={43} textAnchor="middle" fontSize="9" fill="#60a5fa">#{p.num}</text>}
                </svg>
              </div>
            );
          })}
          {bench.length===0 && <span style={{fontSize:11,color:"#4a6a8a"}}>No bench players</span>}
        </div>
      </div>

      {/* Field drag portal ghost — fixed position, always in front */}
      {drag?.moved && field[drag.slot] && dragRef.current?.clientX !== undefined && (()=>{
        const d = dragRef.current;
        const player = field[d.slot];
        if (!player) return null;
        const nm = player.name.length>8?player.name.slice(0,7)+"…":player.name;
        return (
          <div style={{position:"fixed",left:d.clientX-32,top:d.clientY-36,width:64,height:64,pointerEvents:"none",zIndex:9999}}>
            <svg width="64" height="64" viewBox="0 0 64 64">
              {player.isGK&&<circle cx={32} cy={32} r={31} fill="none" stroke="#fbbf24" strokeWidth="2.5" strokeDasharray="5 3"/>}
              <circle cx={32} cy={32} r={30} fill={which==="h1"?"#1e3a8a":"#14532d"} stroke={which==="h1"?"#60a5fa":"#4ade80"} strokeWidth="3"/>
              <text x={32} y={32} textAnchor="middle" dominantBaseline="middle" fontSize="12" fill="#fff" fontWeight="700">{nm}</text>
            </svg>
            <div style={{position:"absolute",bottom:-14,left:"50%",transform:"translateX(-50%)",fontSize:9,color:"#e2e8f0",whiteSpace:"nowrap",fontWeight:500}}>{nm}</div>
          </div>
        );
      })()}

      {/* Bench drag ghost */}
      {benchDragState2 && bench[benchDragState2.benchIdx] && (()=>{
        const bp = bench[benchDragState2.benchIdx];
        const nm = bp.name.length>8?bp.name.slice(0,7)+"…":bp.name;
        return (
          <div style={{position:"fixed",left:benchDragState2.x-32,top:benchDragState2.y-52,width:64,height:64,pointerEvents:"none",zIndex:200,opacity:0.92}}>
            <svg width="64" height="64" viewBox="0 0 64 64">
              <circle cx={32} cy={32} r={28} fill="#1d4ed8" stroke="#93c5fd" strokeWidth="2.5"/>
              <text x={32} y={32} textAnchor="middle" dominantBaseline="middle" fontSize="12" fill="#fff" fontWeight="700">{nm}</text>
            </svg>
          </div>
        );
      })()}

      {/* Bottom bar: Start (h1 only, left) + navigation (right) */}
      <div style={{padding:"8px 10px",background:"#0d1f3c",borderTop:"1px solid #1e3a5f",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
        {!isH2 && (
          <button onClick={()=>{ onSave(); onLaunch(); }}
            style={{padding:"10px 16px",borderRadius:10,border:"none",background:"#15803d",
              color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",flexShrink:0}}>
            ▶ Start
          </button>
        )}
        <div style={{flex:1}}/>
        <button onClick={()=>{ onSave(); onOther(); }}
          style={{padding:"10px 14px",borderRadius:10,border:"1px solid #1e3a5f",
            background:"#071120",color:"#7aa0cc",fontWeight:600,fontSize:13,cursor:"pointer"}}>
          {otherLabel}
        </button>
        <button onClick={()=>{ onSave(); onMenu(); }}
          style={{padding:"10px 14px",borderRadius:10,border:"1px solid #1e3a5f",
            background:"#071120",color:"#7aa0cc",fontWeight:600,fontSize:13,cursor:"pointer"}}>
          Menu
        </button>
      </div>

      {/* DNS player tap modal */}
      {modal==="dnsAction" && selSlot!==null && bench[selSlot] && (()=>{
        const bp = bench[selSlot];
        return (
          <div style={S.overlay} onClick={safeClick2(()=>{setModal(null);setSelSlot(null);})}>
            <div style={S.card} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>{bp.num?`#${bp.num} `:""}{bp.name}</div>
              <div style={{fontSize:12,color:"#f59e0b",marginBottom:6}}>🚫 Did Not Show</div>
              <div style={{fontSize:11,color:"#4a6a8a",marginBottom:14}}>Mark this player as arrived to include them in the formation.</div>
              <button onClick={safeClick2(()=>{
                setBench(bx=>bx.map(b=>b.id===bp.id?{...b,dns:false}:b));
                setModal(null);setSelSlot(null);
              })} style={{...B.act("#15803d","#86efac"),marginBottom:8,textAlign:"center"}}>✅ Mark as Arrived</button>
              <button onClick={safeClick2(()=>{setModal(null);setSelSlot(null);})} style={B.cancel()}>Cancel</button>
            </div>
          </div>
        );
      })()}

      {modal==="benchAction" && selSlot!==null && bench[selSlot] && (()=>{
        const bp = bench[selSlot];
        return (
          <div style={S.overlay} onClick={safeClick2(()=>{setModal(null);setSelSlot(null);})}>
            <div style={S.card} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:800,fontSize:16,color:"#fff",marginBottom:4}}>
                {bp.num?`#${bp.num} `:""}{bp.name}
              </div>
              <div style={{fontSize:11,color:"#7aa0cc",marginBottom:12}}>On bench</div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                <button onClick={safeClick2(()=>{
                  setBench(bx=>bx.map(b=>b.id===bp.id?{...b,dns:true}:b));
                  setModal(null);setSelSlot(null);
                })} style={B.act("#78350f","#fcd34d")}>
                  🚫 Mark Did Not Show
                </button>
              </div>
              <button onClick={safeClick2(()=>{setModal(null);setSelSlot(null);})} style={B.cancel()}>Cancel</button>
            </div>
          </div>
        );
      })()}

      {/* Player tap modal: assign GK or swap with bench */}
      {modal==="player" && selP && (
        <div style={S.overlay} onClick={safeClick2(()=>{setModal(null);setSelSlot(null);})}>
          <div style={S.card} onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:800,fontSize:16,color:"#fff",marginBottom:4}}>{selP.num?`#${selP.num} `:""}{selP.name}</div>
            <div style={{fontSize:11,color:"#7aa0cc",marginBottom:12}}>{selP.isGK?"★ Currently assigned as GK":""}</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              <button onClick={safeClick2(()=>toggleGK2(selSlot))} style={B.act("#7c3aed","#c4b5fd")}>
                {selP.isGK?"★ Remove GK marker":"★ Assign as Goalkeeper"}
              </button>
              {bench.filter(p=>!p.dns&&!p.ejected).length>0 && <>
                <div style={{fontSize:11,color:"#4a6a8a",margin:"4px 0 2px"}}>Swap with bench player:</div>
                {bench.filter(p=>!p.dns&&!p.ejected).map(p=>(
                  <button key={p.id}
                    onClick={safeClick2(()=>doSwap(selSlot, p))}
                    style={{...B.act("#1d4ed8","#93c5fd"),display:"flex",justifyContent:"space-between"}}>
                    <span>{p.num?`#${p.num} `:""}{p.name}</span>
                  </button>
                ))}
              </>}
            </div>
            <button onClick={safeClick2(()=>{setModal(null);setSelSlot(null);})} style={B.cancel()}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}


// ── Summary Screen ────────────────────────────────────────────────────────────
function Summary({ field, bench, events, score, goals, gameMs, teamName, opponent, gameDate, teamSize, competition, statsSaved, onSaveStats, onBack }) {
  const [confirmSave, setConfirmSave] = useState(!statsSaved);
  const [exportedCsv, setExportedCsv] = useState(false);
  const exportedCsvRef = useRef(false);

  function exportGameStats() {
    const now = new Date();
    const dateStr = gameDate || now.toLocaleDateString();
    const timeStr = now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    const oppStr = opponent || "Unknown";

    // Build CSV content
    const esc = v => `"${String(v).replace(/"/g,'""')}"`;
    const rows = [];

    // Section 1: Game Info
    rows.push(["GAME SUMMARY"]);
    rows.push(["Date", dateStr]);
    rows.push(["Time", timeStr]);
    rows.push(["Team", teamName]);
    rows.push(["Opponent", oppStr]);
    rows.push(["Score", score.us + " - " + score.them]);
    rows.push(["Format", teamSize + "v" + teamSize]);
    rows.push(["Total Time", fmt(gameMs)]);
    rows.push([]);

    // Section 2: Player Stats
    rows.push(["PLAYER STATISTICS"]);
    rows.push(["#", "Name", "Status", "Time Played", "1st Half", "2nd Half", "GK Time", "Bench Time", "Goals", "Cards"]);

    // Collect card events per player name
    const cardMap = {};
    events.forEach(ev => {
      const m = ev.text.match(/^(YELLOW|RED) CARD: (.+)$/i);
      if (m) {
        const key = m[2].trim();
        if (!cardMap[key]) cardMap[key] = [];
        cardMap[key].push(m[1].toUpperCase());
      }
    });

    const allPlayers = [
      ...field.map(p=>({...p, status:"Field"})),
      ...bench.map(p=>({...p, status: p.ejected ? "Ejected" : "Bench"}))
    ].sort((a,b)=>(b.totalMs||0)-(a.totalMs||0));

    allPlayers.forEach(p => {
      const g = goals[p.id] || 0;
      const nameKey = (p.num ? "#"+p.num+" " : "") + p.name;
      const cards = (cardMap[nameKey] || []).join(", ") || "";
      rows.push([
        p.num || "",
        p.name,
        p.status + (p.isGK ? " (GK)" : ""),
        fmtS(p.totalMs),
        fmtS(p.h1Ms || 0),
        fmtS(p.h2Ms || 0),
        p.gkMs > 0 ? fmtS(p.gkMs) : "",
        fmtS(p.benchMs || 0),
        g || 0,
        cards
      ]);
    });
    rows.push([]);

    // Section 3: Goals scored
    rows.push(["GOALS"]);
    rows.push(["Time", "Event"]);
    events.filter(ev=>ev.text.includes("GOAL")).forEach(ev=>{
      rows.push([ev.time, ev.text]);
    });
    rows.push([]);

    // Section 4: Full event log
    rows.push(["EVENT LOG"]);
    rows.push(["Time", "Event"]);
    events.forEach(ev => rows.push([ev.time, ev.text]));

    const csv = rows.map(r => r.map(esc).join(",")).join("\r\n");
    const bom = "\uFEFF"; // UTF-8 BOM so Excel opens it correctly
    const blob = new Blob([bom + csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (teamName + "_vs_" + oppStr + "_" + dateStr).replace(/[^a-z0-9_\-]/gi,"_");
    a.href = url; a.download = safeName + ".csv"; a.click();
    URL.revokeObjectURL(url);
    exportedCsvRef.current = true;
    setExportedCsv(true);
  }

  function returnToSetup(saveStats=false) {
    if (saveStats) onSaveStats();
    if (!exportedCsvRef.current) {
      const shouldExport = window.confirm("Export this game to CSV before returning to setup?");
      if (shouldExport) exportGameStats();
    }
    setConfirmSave(false);
    onBack();
  }

  function requestMenuReturn() {
    if (confirmSave && !statsSaved) {
      const saveStats = window.confirm("Save this game's player stats before returning to setup?");
      returnToSetup(saveStats);
      return;
    }
    returnToSetup(false);
  }

  const [sortBy, setSort] = useState("totalMs");
  const all = [
    ...field.map(p=>({...p, onBench:false})),
    ...bench.map(p=>({...p, onBench:true})),
  ].sort((a,b) => {
    if (sortBy==="totalMs") return (b.totalMs||0)-(a.totalMs||0);
    if (sortBy==="benchMs") return (b.benchMs||0)-(a.benchMs||0);
    if (sortBy==="goals")   return (goals[b.id]||0)-(goals[a.id]||0);
    return 0;
  });

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:"#071120",height:"100dvh",overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",color:"#fff",padding:"16px 14px",paddingBottom:"calc(18px + env(safe-area-inset-bottom))",maxWidth:480,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:20}}>📊</span>
          <span style={{fontSize:18,fontWeight:800,color:"#60a5fa"}}>Game Summary</span>
        </div>
        <div style={{display:"flex",gap:6,flexShrink:0}}>
          <button onClick={exportGameStats} style={{background:exportedCsv?"#166534":"#15803d",border:"none",color:"#bbf7d0",padding:"7px 10px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer"}}>{exportedCsv?"✓ Exported":"⬇ Export CSV"}</button>
          <button onClick={requestMenuReturn} style={{background:"#1d4ed8",border:"none",color:"#dbeafe",padding:"7px 10px",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer"}}>Menu</button>
        </div>
      </div>

      <div style={{background:"#0d1f3c",borderRadius:12,padding:"12px",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-around",alignItems:"center",marginBottom:8}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:38,fontWeight:800}}>{score.us}</div>
            <div style={{fontSize:11,color:"#7aa0cc"}}>{teamName}</div>
          </div>
          <div style={{fontSize:11,color:"#4a6a8a",textAlign:"center"}}>
            <div style={{fontSize:13,fontWeight:600}}>{fmt(gameMs)}</div>
            <div>total time</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:38,fontWeight:800}}>{score.them}</div>
            <div style={{fontSize:11,color:"#7aa0cc"}}>{opponent||"Opponent"}</div>
          </div>
        </div>
        <div style={{borderTop:"1px solid #1e3a5f",paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:11,color:"#4a6a8a"}}>
          <span>📅 {gameDate || new Date().toLocaleDateString()}</span>
          <span>{teamSize}v{teamSize}</span>
          {opponent && <span>vs {opponent}</span>}
        </div>
      </div>

      {/* Sort */}
      <div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center"}}>
        <span style={{fontSize:10,color:"#4a6a8a",marginRight:2}}>Sort:</span>
        {[["totalMs","⏱ Played"],["benchMs","🪑 Bench"],["goals","⚽ Goals"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSort(k)} style={{flex:1,padding:"6px 0",borderRadius:8,border:sortBy===k?"2px solid #3b82f6":"1px solid #1e3a5f",background:sortBy===k?"#1d4ed8":"#0d1f3c",color:sortBy===k?"#fff":"#7aa0cc",fontWeight:600,fontSize:11,cursor:"pointer"}}>{l}</button>
        ))}
      </div>

      {/* Table */}
      <div style={{background:"#0d1f3c",borderRadius:12,overflow:"hidden",marginBottom:14}}>
        <div style={{display:"grid",gridTemplateColumns:"28px 1fr 58px 58px 36px",gap:3,padding:"7px 10px",background:"#1e3a5f",fontSize:10,color:"#4a6a8a",fontWeight:700,letterSpacing:0.3}}>
          <span>#</span><span>Player</span>
          <span style={{textAlign:"right",color:sortBy==="totalMs"?"#60a5fa":undefined}}>Played</span>
          <span style={{textAlign:"right",color:"#fbbf24"}}>GK</span>
          <span style={{textAlign:"right",color:sortBy==="benchMs"?"#f87171":undefined}}>Bench</span>
          <span style={{textAlign:"right",color:sortBy==="goals"?"#f59e0b":undefined}}>⚽</span>
        </div>
        {all.length===0 && <div style={{padding:"12px 10px",color:"#4a6a8a",fontSize:13}}>No players</div>}
        {all.map((p,i)=>{
          const g=goals[p.id]||0;
          return (
            <div key={p.id} style={{display:"grid",gridTemplateColumns:"28px 1fr 52px 46px 52px 32px",gap:3,padding:"8px 10px",borderTop:i>0?"1px solid #1e3a5f":"none",alignItems:"center"}}>
              <span style={{fontSize:11,color:"#60a5fa",fontWeight:700}}>{p.num||"—"}</span>
              <div style={{overflow:"hidden"}}>
                <div style={{fontSize:13,color:p.ejected?"#fca5a5":p.onBench?"#4a6a8a":"#e2e8f0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}{p.isGK?<span style={{color:"#fbbf24",fontSize:9,marginLeft:4}}>GK</span>:""}{p.ejected?<span style={{color:"#fca5a5",fontSize:9,marginLeft:4}}>🟥 ejected</span>:""}</div>
                {p.onBench && !p.ejected && <div style={{fontSize:9,color:"#4a6a8a"}}>bench</div>}
              </div>
              <span style={{fontSize:12,color:"#4ade80",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmtS(p.totalMs)}</span>
              <span style={{fontSize:11,color:(p.gkMs||0)>0?"#fbbf24":"#1e3a5f",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{(p.gkMs||0)>0?fmtS(p.gkMs):"—"}</span>
              <span style={{fontSize:12,color:"#f87171",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{fmtS(p.benchMs||0)}</span>
              <span style={{fontSize:13,color:g>0?"#f59e0b":"#4a6a8a",textAlign:"right",fontWeight:g>0?700:400}}>{g||"—"}</span>
            </div>
          );
        })}
      </div>

      {/* Events */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:10,color:"#4a6a8a",fontWeight:700,letterSpacing:1,marginBottom:7}}>EVENTS</div>
        <div style={{maxHeight:220,overflowY:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",background:"#0d1f3c",border:"1px solid #1e3a5f",borderRadius:10,padding:"4px 8px"}}>
          {events.length===0 && <div style={{fontSize:12,padding:"8px 0",color:"#4a6a8a"}}>No events recorded</div>}
          {events.map((ev,i)=>(
            <div key={i} style={{fontSize:12,padding:"5px 0",borderBottom:i<events.length-1?"1px solid #1e3a5f":"none",color:"#93c5fd"}}>
              <span style={{color:"#4a6a8a",marginRight:8}}>{ev.time}</span>{ev.text}
            </div>
          ))}
        </div>
      </div>

      {confirmSave ? (
        <div style={{background:"#0d1f3c",borderRadius:12,padding:"14px",marginTop:8}}>
          <div style={{fontSize:14,color:"#fff",fontWeight:700,marginBottom:6}}>End Game — save stats?</div>
          <div style={{fontSize:11,color:"#7aa0cc",marginBottom:12}}>Add each player's minutes, goals and cards to their career totals?</div>
          <button onClick={()=>returnToSetup(true)} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"#15803d",color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer",marginBottom:8}}>✓ Save stats &amp; end</button>
          <button onClick={()=>returnToSetup(false)} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",background:"#7f1d1d",color:"#fca5a5",fontWeight:700,fontSize:14,cursor:"pointer"}}>✗ End without saving</button>
        </div>
      ) : (
        <button onClick={()=>returnToSetup(false)} style={{width:"100%",padding:"13px",borderRadius:12,background:"#1d4ed8",border:"none",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer"}}>🏁 End Game &amp; Return to Setup</button>
      )}
    </div>
  );
}

// ── Shared styles ─────────────────────────────────────────────────────────────
const S = {
  root:     { fontFamily:"system-ui,sans-serif", background:"#071120", height:"100%", color:"#fff", display:"flex", flexDirection:"column", userSelect:"none", maxWidth:480, margin:"0 auto", overflow:"hidden" },
  header:   { display:"flex", alignItems:"center", justifyContent:"space-between", padding:"5px 12px", background:"#0d1f3c", borderBottom:"1px solid #1e3a5f", flexShrink:0 },
  overlay:  { position:"fixed", inset:0, background:"rgba(0,0,0,0.82)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:100, padding:16 },
  card:     { background:"#0d1f3c", borderRadius:16, padding:"18px 16px", width:"100%", maxWidth:340, border:"1px solid #1e3a5f" },
};

const B = {
  sm:     (bg,c) => ({ background:bg, border:"none", color:c, padding:"5px 10px", borderRadius:7, fontSize:11, fontWeight:600, cursor:"pointer" }),
  smFull: (bg,c) => ({ background:bg, border:"1px solid #1e3a5f", color:c, padding:"9px 0", borderRadius:9, fontSize:12, fontWeight:600, cursor:"pointer" }),
  ctrl:   (bg,c,bold=false) => ({ background:bg, border:"none", color:c, padding:"8px 14px", borderRadius:8, fontSize:13, fontWeight:bold?700:600, cursor:"pointer" }),
  ctrlCompact: (bg,c,bold=false) => ({ background:bg, border:"none", color:c, width:54, padding:"7px 0", borderRadius:7, fontSize:11, fontWeight:bold?700:600, cursor:"pointer", whiteSpace:"nowrap", lineHeight:1.1, flex:"0 0 54px", textAlign:"center" }),
  act:    (bg,c) => ({ background:bg, border:"none", color:c, padding:"10px 14px", borderRadius:9, fontSize:13, fontWeight:600, cursor:"pointer", width:"100%", textAlign:"left" }),
  cancel: ()     => ({ marginTop:12, width:"100%", padding:"7px", background:"transparent", border:"1px solid #1e3a5f", borderRadius:8, color:"#7aa0cc", cursor:"pointer", fontSize:13 }),
  inp:    ()     => ({ width:"100%", padding:"10px 12px", borderRadius:9, background:"#0d1f3c", border:"1px solid #1e3a5f", color:"#fff", fontSize:14, marginBottom:12, boxSizing:"border-box", outline:"none" }),
  lbl:    ()     => ({ display:"block", fontSize:10, color:"#4a6a8a", fontWeight:700, letterSpacing:1, marginBottom:6 }),
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(React.StrictMode, null, React.createElement(App)));
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js").catch(function(err) {
      console.warn("Service worker registration failed", err);
    });
  });
}
</script>
